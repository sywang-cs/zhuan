<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中安法规复习站</title>
<style>
  :root{
    --ink:#3d2432;
    --muted:#7b6270;
    --line:#f3c9d8;
    --bg:#fff6fa;
    --panel:#ffffff;
    --teal:#2f9f8f;
    --blue:#7c6bd8;
    --amber:#d68a2f;
    --pink:#e84f8a;
    --soft:#ffe6ef;
  }
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,#fff0f6 0,#fff9fc 260px,#fff6fa 100%);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{background:linear-gradient(135deg,#ff7cab 0%,#ffb3c8 55%,#ffe0b5 100%);color:#fff;padding:34px 18px 42px;border-bottom:1px solid #ffd5e2}
  .wrap{max-width:980px;margin:0 auto}
  h1{margin:0;font-size:34px;letter-spacing:0;text-shadow:0 2px 10px rgba(157,46,91,.22)}
  header p{margin:8px 0 0;color:#fff8fb}
  main{max-width:980px;margin:-20px auto 0;padding:22px 14px 70px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
  .card{display:flex;flex-direction:column;min-height:200px;padding:18px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.92);text-decoration:none;color:inherit;box-shadow:0 12px 28px rgba(232,79,138,.10)}
  .card:hover{border-color:#f28ab4;box-shadow:0 16px 34px rgba(232,79,138,.18);transform:translateY(-1px)}
  .tag{display:inline-flex;width:max-content;border-radius:999px;padding:3px 10px;font-size:13px;background:#ffe6ef;color:#c8326d;font-weight:700}
  .tag.blue{background:#eeeaff;color:var(--blue)}
  .tag.amber{background:#fff0c9;color:var(--amber)}
  h2{margin:14px 0 8px;font-size:22px}
  .card p{margin:0;color:var(--muted)}
  .go{margin-top:auto;padding-top:18px;color:#d93676;font-weight:800}
  .note{margin-top:18px;padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted);box-shadow:0 10px 24px rgba(232,79,138,.08)}
</style>
<header>
  <div class="wrap">
    <h1>中安法规复习站</h1>
    <p>子瑜陛下记得喝水。刷题、考点速背、详细思维导图都放在这里。</p>
  </div>
</header>
<main>
  <section class="grid">
    <a class="card" href="quiz.html">
      <span class="tag">刷题</span>
      <h2>选择题练习</h2>
      <p>251 道选择题，支持章节筛选、错题、随机 20 题、分数统计和考点依据。</p>
      <span class="go">开始刷题</span>
    </a>
    <a class="card" href="points.html">
      <span class="tag blue">背诵</span>
      <h2>考点速背</h2>
      <p>按章节和考点整理高频规定，重点词高亮，适合考前快速过一遍。</p>
      <span class="go">查看考点</span>
    </a>
    <a class="card" href="mindmap.html">
      <span class="tag amber">框架</span>
      <h2>详细思维导图</h2>
      <p>章、节、考点、关键规定逐层展开，适合先搭框架再补细节。</p>
      <span class="go">打开导图</span>
    </a>
  </section>
  <section class="note">
    建议顺序：先看思维导图建立框架，再看考点速背，最后用随机 20 题检验。
  </section>
</main>
</html>
