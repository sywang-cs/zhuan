<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中安法规复习站</title>
<style>
  :root{
    --ink:#182230;
    --muted:#667085;
    --line:#d0d5dd;
    --bg:#f5f7fb;
    --panel:#ffffff;
    --teal:#0f766e;
    --blue:#175cd3;
    --amber:#b54708;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{background:#12343b;color:#fff;padding:30px 18px}
  .wrap{max-width:980px;margin:0 auto}
  h1{margin:0;font-size:32px;letter-spacing:0}
  header p{margin:8px 0 0;color:#d5ece8}
  main{max-width:980px;margin:0 auto;padding:22px 14px 70px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
  .card{display:flex;flex-direction:column;min-height:190px;padding:18px;border:1px solid var(--line);border-radius:10px;background:var(--panel);text-decoration:none;color:inherit}
  .card:hover{border-color:var(--teal);box-shadow:0 10px 28px rgba(16,24,40,.08)}
  .tag{display:inline-flex;width:max-content;border-radius:999px;padding:2px 9px;font-size:13px;background:#e6f4f1;color:var(--teal)}
  .tag.blue{background:#eef4ff;color:var(--blue)}
  .tag.amber{background:#fff6ed;color:var(--amber)}
  h2{margin:14px 0 8px;font-size:22px}
  .card p{margin:0;color:var(--muted)}
  .go{margin-top:auto;padding-top:18px;color:var(--teal);font-weight:700}
  .note{margin-top:18px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--muted)}
</style>
<header>
  <div class="wrap">
    <h1>中安法规复习站</h1>
    <p>刷题、考点速背、详细思维导图都放在这里。纯静态网页，可部署到 GitHub Pages 或阿里云 OSS。</p>
  </div>
</header>
<main>
  <section class="grid">
    <a class="card" href="quiz.html">
      <span class="tag">刷题</span>
      <h2>选择题练习</h2>
      <p>251 道选择题，支持章节筛选、错题、随机 20 题、分数统计和考点依据。</p>
      <span class="go">开始刷题</span>
    </a>
    <a class="card" href="points.html">
      <span class="tag blue">背诵</span>
      <h2>考点速背</h2>
      <p>按章节和考点整理高频规定，重点词高亮，适合考前快速过一遍。</p>
      <span class="go">查看考点</span>
    </a>
    <a class="card" href="mindmap.html">
      <span class="tag amber">框架</span>
      <h2>详细思维导图</h2>
      <p>章、节、考点、关键规定逐层展开，适合先搭框架再补细节。</p>
      <span class="go">打开导图</span>
    </a>
  </section>
  <section class="note">
    建议顺序：先看思维导图建立框架，再看考点速背，最后用随机 20 题检验。
  </section>
</main>
</html>
