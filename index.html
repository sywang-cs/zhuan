预案管理办法", "point": "考点四：应急预案的备案", "options": [{"key": "A", "text": "生产经营单位风险种类多、可能发生多种类型事故的，应当组织编制专项应急预案"}, {"key": "B", "text": "烟花爆竹生产企业应当对本单位编制的应急预案进行评审，并形成书面评审纪要"}, {"key": "C", "text": "地方各级人民政府应急管理部门的应急预案，应当报上一级人民政府应急管理部门，同时抄送同级人民政府备案"}, {"key": "D", "text": "属于中央企业的建筑施工单位，其总部（上市公司）的应急预案，报所在地的省、自治区、直辖市或设区的市级主管的有关部门备案，并抄送同级应急管理部门"}], "answer": "B", "question": "根据《生产安全事故应急预案管理办法》，关于应急预案备案的说法，正确的是（）。", "id": 224, "explanation": ["1.政府部门预案的备案", "第二十五条地方各级人民政府应急管理部门的应急预案，应当报同级人民政府备案，同时抄送上一级人民政府应急管理部门，并依法向社会公布", "地方各级人民政府其他负有安全生产监督管理职责的部门的应急预案，应当抄送同级人民政府应急管理部门", "2.生产经营单位预案的备案"]}, {"type": "单选", "chapter": "安全生产部门规章", "section": "第六节 生产安全事故应急预案管理办法", "point": "考点五：应急预案的实施", "options": [{"key": "A", "text": "各级人民政府应急管理部门应当至少每年组织一次应急预案演练，提高本部门、本地区生产安全事故应急处置能力"}, {"key": "B", "text": "矿山生产经营单位根据制定的应急预案演练计划，每年至少组织一次综合应急预案演练，每月至少组织一次现场处置方案演练"}, {"key": "C", "text": "烟花爆竹生产、批发经营企业和中型规模以上的其他生产经营单位，应当每三年进行一次应急预案评估"}, {"key": "D", "text": "应急预案评估必须由相关专业机构或者有关专家、有实际应急救援工作经验的人员参加，必要时可以委托安全生产技术服务机构实施"}], "answer": "C", "question": "依据《生产安全事故应急预案管理办法》的规定，下列关于应急预案的演练及评估的说法，正确的是（ ）。", "id": 225, "explanation": ["第三十二条各级人民政府应急管理部门应当至少每两年组织一次应急预案演练，提高本部门、本地区生产安全事故应急处置能力", "第三十三条生产经营单位应当制定本单位的应急预案演练计划，根据本单位的事故风险特点，每年至少组织一次综合应急预案演练或者专项应急预案演练，每半年至少组织一次现场处置方案演练", "易燃易爆物品、危险化学品等危险物品的生产、经营、储存、运输单位，矿山、金属冶炼、城市轨道交通运营、建筑施工单位，以及宾馆、商场、娱乐场所、旅游景区等人员密集场所经营单位，应当至少每半年组织一次生产安全事故应急预案演练，并将演练情况报送所在地县级以上地方人民政府负有安全生产监督管理职责的部门", "县级以上地方人民政府负有安全生产监督管理职责的部门应当对本行政区域内前款规定的重点生产经营单位的生产安全事故应急救援预案演练进行抽查；"]}, {"type": "多选", "chapter": "安全生产部门规章", "section": "第七节 生产安全事故信息报告和处置办法", "point": "考点二：较大涉险事故的范围", "options": [{"key": "A", "text": "某化工厂发生火灾事故，造成 2 人死亡"}, {"key": "B", "text": "某建筑施工单位发生坍塌事故，造成 5 人被困"}, {"key": "C", "text": "某烟花爆竹生产企业发生爆炸，造成 9 人涉险"}, {"key": "D", "text": "某道路运输单位发生交通事故，造成 1 人下落不明"}, {"key": "E", "text": "某危险化学品单位发生毒气泄漏，造成紧急疏散人员 600 人"}], "answer": "BE", "question": "根据《生产安全事故信息报告和处置办法》规定，下列描述中，属于较大涉险事故的是（）。", "id": 226, "explanation": ["第二十六条本办法所称的较大涉险事故是指：", "（1）涉险10人以上的事故；", "（2）造成3人以上被困或者下落不明的事故；", "（3）紧急疏散人员500人以上的事故；"]}, {"type": "单选", "chapter": "安全生产部门规章", "section": "第七节 生产安全事故信息报告和处置办法", "point": "考点三：事故信息的报告", "options": [{"key": "A", "text": "较大事故逐级上报至省级应急管理部门、矿山安全监察分局"}, {"key": "B", "text": "发生较大生产安全事故，县级应急管理部门应当在 2 小时内先用电话快报省级应急管理部门、省级矿山安全监察机构"}, {"key": "C", "text": "特别重大事故每日至少续报 1 次"}, {"key": "D", "text": "火灾事故自发生之日起 7 日内，事故造成的伤亡人数发生变化的，应于当日续报"}], "answer": "D", "question": "依据《生产安全事故信息报告和处置办法》，下列关于事故信息报告的说法，正确的是（ ）。", "id": 227, "explanation": ["1.事故信息报告的时间要求", "第六条生产经营单位发生生产安全事故或者较大涉险事故，其单位负责人接到事故信息报告后应当于1小时内报告事故发生地县级安全生产监督管理部门、煤矿安全监察分局", "发生较大以上生产安全事故的，事故发生单位在依照第一款规定报告的同时，应当在1小时内报告省级安全生产监督管理部门、省级煤矿安全监察机构", "发生重大、特别重大生产安全事故的，事故发生单位在依照本条第一款、第二款规定报告的同时，可以立即报告国家安全生产监督管理总局、国家煤矿安全监察局"]}, {"type": "单选", "chapter": "安全生产部门规章", "section": "第七节 生产安全事故信息报告和处置办法", "point": "考点四：举报事故信息的处置", "options": [{"key": "A", "text": "对举报发生较大涉险事故的，应急管理部门、煤矿安全监察机构立即组织查证核实，并在 2 个月内向上一级应急管理部门、煤矿安全监察机构报告核实结果"}, {"key": "B", "text": "对举报发生生产安全事故的，应急管理部门在将初步查证的事故简要情况报告上一级应急管理部门后，在 1 个月内报告详细核实结果"}, {"key": "C", "text": "对举报发生生产安全事故的，应急管理部门在 10 日内对事故情况进行初步查证"}, {"key": "D", "text": "煤矿安全监察机构的事故信息举报核查通知后，应当立即组织查证核实，并在 1 个月内向上一级煤矿安全监察机构报告核实结果"}], "answer": "A", "question": "根据《生产安全事故信息报告和处置办法》，下列关于事故信息举报处置的做法，正确的是（ ）。", "id": 228, "explanation": ["第十二条安全生产监督管理部门、煤矿安全监察机构接到任何单位或者个人的事故信息举报后，应当立即与事故单位或者下一级安全生产监督管理部门、煤矿安全监察机构联系，并进行调查核实", "下一级安全生产监督管理部门、煤矿安全监察机构接到上级安全生产监督管理部门、煤矿安全监察机构的事故信息举报核查通知后，应当立即组织查证核实，并在2个月内向上一级安全生产监督管理部门、煤矿安全监察机构报告核实结果", "对发生较大涉险事故的，安全生产监督管理部门、煤矿安全监察机构依照本条第二款规定向上一级安全生产监督管理部门、煤矿安全监察机构报告核实结果；", "对发生生产安全事故的，安全生产监督管理部门、煤矿安全监察机构应当在5日内对事故情况进行初步查证，并将事故初步查证的简要情况报告上一级安全生产监督管理部门、煤矿安全监察机构，详细核实结果在2个月内报告"]}, {"type": "单选", "chapter": "安全生产部门规章", "section": "第七节 生产安全事故信息报告和处置办法", "point": "考点五：现场调查", "options": [{"key": "A", "text": "应急管理部、国家矿山安全监察局负责人"}, {"key": "B", "text": "省级应急管理部门、省级矿山安全监察局负责人"}, {"key": "C", "text": "设区的市级应急管理部门、省级矿山安全监察局负责人"}, {"key": "D", "text": "县级应急管理部门、矿山安全监察分局负责人"}], "answer": "B", "question": "依据《生产安全事故信息报告和处置办法》，生产经营单位发生重大生产安全事故的，需立即赶赴事故现场的是（ ）。", "id": 229, "explanation": ["第十八条安全生产监督管理部门、煤矿安全监察机构接到生产安全事故报告后，应当按照下列规定派员立即赶赴事故现场：", "（1）发生一般事故的，县级安全生产监督管理部门、煤矿安全监察分局负责人立即赶赴事故现场；", "（2）发生较大事故的，设区的市级安全生产监督管理部门、省级煤矿安全监察局负责人应当立即赶赴事故现场；", "（3）发生重大事故的，省级安全监督管理部门、省级煤矿安全监察局负责人立即赶赴事故现场；"]}, {"type": "单选", "chapter": "安全生产部门规章", "section": "第八节 建设工程消防设计审查验收管理暂行规定", "point": "考点二：有关单位的消防设计、施工质量责任与义务", "options": [{"key": "A", "text": "参加建设单位组织的建设工程竣工验收，对建设工程消防施工质量签章确认，并对建设工程消防施工质量负责"}, {"key": "B", "text": "依法申请建设工程消防设计审核、消防验收，依法办理消防设计和竣工验收消防备案手续并接受抽查"}, {"key": "C", "text": "按照建设工程法律法规、国家工程建设消防技术标准，以及经消防设计审查合格或者满足工程需要的消防设计文件实施工程监理"}, {"key": "D", "text": "按照工程消防设计要求和合同约定，选用合格的消防产品和满足防火性能要求的建筑材料、建筑构配件和设备"}], "answer": "A", "question": "依据《建设工程消防设计审查验收管理暂行规定》，施工单位应当承担的施工质量责任是（ ）。", "id": 230, "explanation": ["第九条建设单位应当履行下列消防设计、施工质量责任和义务：", "（一）不得明示或者暗示设计、施工、工程监理、技术服务等单位及其从业人员违反建设工程法律法规和国家工程建设消防技术标准，降低建设工程消防设计、施工质量；", "（二）依法申请建设工程消防设计审查、消防验收，办理备案并接受抽查；", "（六）组织有关单位进行建设工程竣工验收时，对建设工程是否符合消防要求进行查验；"]}, {"type": "单选", "chapter": "安全生产部门规章", "section": "第八节 建设工程消防设计审查验收管理暂行规定", "point": "考点三：特殊建设工程的消防设计审查", "options": [{"key": "A", "text": "总建筑面积大于二万平方米的体育场馆"}, {"key": "B", "text": "总建筑面积小于五百平方米的歌舞厅"}, {"key": "C", "text": "总建筑面积大于一万平方米的宾馆"}, {"key": "D", "text": "总建筑面积大于一万五千平方米的民用机场航站楼"}], "answer": "B", "question": "根据《建设工程消防设计审查验收管理暂行规定》，特殊建设工程不包括（）。", "id": 231, "explanation": ["（二）特殊建设工程的审查", "第十五条对特殊建设工程实行消防设计审查制度", "特殊建设工程的建设单位应当向消防设计审查验收主管部门申请消防设计审查，消防设计审查验收主管部门依法对审查的结果负责", "特殊建设工程未经消防设计审查或者审查不合格的，建设单位、施工单位不得施工"]}, {"type": "单选", "chapter": "安全生产部门规章", "section": "第八节 建设工程消防设计审查验收管理暂行规定", "point": "考点五：其他建设工程的消防设计、备案与抽查", "options": [{"key": "A", "text": "消防设计审查验收主管部门应当对备案的其他建设工程进行抽查，抽取比例由设区的市级人民政府住房和城乡建设主管部门，结合辖区内消防设计、施工质量情况确定，并向社会公示"}, {"key": "B", "text": "建设工程竣工验收后，建设单位应当向消防设计审查验收主管部门申请消防验收"}, {"key": "C", "text": "其他建设工程，建设单位申请施工许可或者申请批准开工报告时，应当提供满足施工需要的消防设计图纸及技术资料"}, {"key": "D", "text": "建设工程竣工验收合格之日起十个工作日内，建设单位应当报消防设计审查验收主管部门备案"}], "answer": "C", "question": "根据《建设工程消防设计审查验收管理暂行规定》，下列关于消防设计审查验收的说法，正确的是（）。", "id": 232, "explanation": ["第三十二条其他建设工程，建设单位申请施工许可或者申请批准开工报告时，应当提供满足施工需要的消防设计图纸及技术资料", "未提供满足施工需要的消防设计图纸及技术资料的，有关部门不得发放施工许可证或者批准开工报告", "第三十四条其他建设工程竣工验收合格之日起五个工作日内，建设单位应当报消防设计审查验收主管部门备案", "建设单位办理备案，应当提交下列材料："]}, {"type": "单选", "chapter": "安全生产部门规章", "section": "第九节 高层民用建筑消防安全管理规定", "point": "考点一：基本规定", "options": [{"key": "A", "text": "建筑高度 26 米的住宅楼"}, {"key": "B", "text": "建筑高度 30 米的非单层宿舍"}, {"key": "C", "text": "建筑高度 23 米的非单层办公楼"}, {"key": "D", "text": "建筑高度 20 米的非单层公寓楼"}], "answer": "B", "question": "高层民用建筑消防安全管理贯彻预防为主、防消结合的方针，实行消防安全责任制。根据《高层民用建筑消防安全管理规定》，下列建筑中，属于高层公共建筑的是（ ）。", "id": 233, "explanation": ["建筑高度超过100米的高层民用建筑应当实行更加严格的消防安全管理"]}, {"type": "单选", "chapter": "安全生产部门规章", "section": "第九节 高层民用建筑消防安全管理规定", "point": "考点三：消防安全管理", "options": [{"key": "A", "text": "高层公共建筑内餐饮场所的经营单位应当及时对厨房灶具和排油烟罩设施进行清洗，排油烟管道每季度至少进行一次检查、清洗"}, {"key": "B", "text": "高层民用建筑的户外广告牌、外装饰不得采用易燃、可燃、难燃材料，必须使用不燃材料"}, {"key": "C", "text": "建筑高度超过 30 米的高层民用建筑外墙上设置的装饰、广告牌应当采用不燃材料并易于破拆"}, {"key": "D", "text": "高层民用建筑消防控制室应当由其管理单位实行 24 小时值班制度，每班不应少于 3 名值班人员"}], "answer": "A", "question": "根据《高层民用建筑消防安全管理规定》，下列关于消防安全管理的说法，正确的是（ ）。", "id": 234, "explanation": ["第二十条高层民用建筑的电缆井、管道井等竖向管井和电缆桥架应当在每层楼板处进行防火封堵，管井检查门应当采用防火门", "第二十一条高层民用建筑的户外广告牌、外装饰不得采用易燃、可燃材料，不得妨碍防烟排烟、逃生和灭火救援，不得改变或者破坏建筑立面防火结构", "建筑高度超过50米的高层民用建筑外墙上设置的装饰、广告牌应当采用不燃材料并易于破拆", "第二十三条高层公共建筑内餐饮场所的经营单位应当及时对厨房灶具和排油烟罩设施进行清洗，排油烟管道每季度至少进行一次检查、清洗"]}, {"type": "单选", "chapter": "安全生产部门规章", "section": "第九节 高层民用建筑消防安全管理规定", "point": "考点四：消防宣传教育和灭火疏散预案", "options": [{"key": "A", "text": "高层民用建筑应当每年至少进行一次全要素综合演练"}, {"key": "B", "text": "建筑高度超过 100 米的高层公共建筑应当每半年至少进行一次全要素综合演练"}, {"key": "C", "text": "高层民用建筑应当进行每周防火巡查，并填写巡查记录"}, {"key": "D", "text": "高层住宅建筑的物业服务企业应当每年至少对居住人员进行一次消防安全教育培训，进行一次疏散演练"}], "answer": "C", "question": "根据《高层民用建筑消防安全管理规定》，关于高层民用建筑，下列选项说法错误的是（）。", "id": 235, "explanation": ["第三十四条高层民用建筑应当进行每日防火巡查，并填写巡查记录", "其中，高层公共建筑内公众聚集场所在营业期间应当至少每2小时进行一次防火巡查，医院、养老院、寄宿制学校、幼儿园应当进行白天和夜间防火巡查，高层住宅建筑和高层公共建筑内的其他场所可以结合实际确定防火巡查的频次", "防火巡查应当包括下列内容：", "（三）消防设施、器材完好情况，常闭式防火门关闭情况；"]}, {"type": "单选", "chapter": "安全生产部门规章", "section": "第十节 工贸企业粉尘防爆安全规定", "point": "考点四：法律责任", "options": [{"key": "A", "text": "企业新建、改建、扩建工程项目安全设施没有进行粉尘防爆安全设计"}, {"key": "B", "text": "未按照规定对有关负责人和粉尘作业岗位相关从业人员进行粉尘防爆专项安全生产教育和培训"}, {"key": "C", "text": "未如实记录粉尘防爆隐患排查治理情况"}, {"key": "D", "text": "未制定有关粉尘爆炸事故应急救援预案"}], "answer": "A", "question": "依据《工贸企业粉尘防爆安全规定》，下列违法情形，应当由负责粉尘涉爆企业安全监管的部门责令限期改正，处 3 万元以下罚款的情形的是（ ）。", "id": 236, "explanation": ["第二十七条粉尘涉爆企业有下列行为之一的，由负责粉尘涉爆企业安全监管的部门依照《中华人民共和国安全生产法》有关规定，责令限期改正，处5万元以下的罚款；", "逾期未改正的，处5万元以上20万元以下的罚款，对其直接负责的主管人员和其他直接责任人员处1万元以上2万元以下的罚款；", "情节严重的，责令停产停业整顿；", "构成犯罪的，依照刑法有关规定追究刑事责任："]}, {"type": "单选", "chapter": "安全生产部门规章", "section": "第十一节 建设项目安全设施“三同时”监督管理办法", "point": "考点三：建设项目安全预评价", "options": [{"key": "A", "text": "船厂扩建的建设项目，生产经营单位应当对其安全生产条件和设施进行综合分析，形成书面报告备查"}, {"key": "B", "text": "金属冶炼建设项目应当按照国家规定，进行安全预评价"}, {"key": "C", "text": "大型食品加工建设项目应当进行安全预评价，并编制安全预评价报告"}, {"key": "D", "text": "生产、储存烟花爆竹的建设项目应当进行安全预评价"}], "answer": "C", "question": "依据《建设项目安全设施“三同时”监督管理办法》，下列关于安全预评价的说法错误的是（ ）。", "id": 237, "explanation": ["第七条下列建设项目在进行可行性研究时，生产经营单位应当按照国家规定，进行安全预评价：", "第七条规定以外的其他建设项目，生产经营单位应当对其安全生产条件和设施进行综合分析，形成书面报告备查"]}, {"type": "单选", "chapter": "安全生产部门规章", "section": "第十一节 建设项目安全设施“三同时”监督管理办法", "point": "考点四：建设项目安全设施设计审查", "options": [{"key": "A", "text": "设计单位应当向应急管理部门提出审查申请"}, {"key": "B", "text": "生产经营单位应当向住建部门备案"}, {"key": "C", "text": "生产经营单位向应急管理部门提出审查申请，应当提交设计单位的设计资质证明文件"}, {"key": "D", "text": "已受理的安全设施设计审查申请，应急管理部门应当在 30 日内给出是否批准的决定"}], "answer": "C", "question": "某大型钢铁冶炼单位新建一处厂房，依据《建设项目安全设施“三同时”监督管理办法》，下列关于该建设项目安全设施设计完成后，进行设计审查的说法中，正确的是（ ）。", "id": 238, "explanation": ["安全设施设计完成后，生产经营单位应当按照本办法", "第五条的规定向安全生产监督管理部门提出审查申请，并提交下列文件资料：", "（1）建设项目审批、核准或者备案的文件；", "（2）建设项目安全设施设计审查申请；"]}, {"type": "单选", "chapter": "安全生产部门规章", "section": "第十一节 建设项目安全设施“三同时”监督管理办法", "point": "考点五：建设项目安全设施施工和竣工验收", "options": [{"key": "A", "text": "生产经营单位应当委托具有相应资质的安全评价机构对安全设施进行验收评价"}, {"key": "B", "text": "建设项目竣工投入生产或者使用前，生产经营单位应当组织对安全设施进行竣工验收，并形成书面报告备查"}, {"key": "C", "text": "应急管理部门对安全设施竣工验收报告按照不少于总数 15%的比例进行随机抽查"}, {"key": "D", "text": "应急管理部门在实施有关安全许可时，对建设项目安全设施竣工验收报告进行审查"}], "answer": "C", "question": "依据《建设项目安全设施“三同时”监督管理办法》的规定，对于金属冶炼建设项目进行安全设施验收的说法，错误的是（）", "id": 239, "explanation": ["第十七条建设项目安全设施的施工应当由取得相应资质的施工单位进行，并与建设项目主体工程同时施工", "施工单位应当在施工组织设计中编制安全技术措施和施工现场临时用电方案，同时对危险性较大的分部分项工程依法编制专项施工方案，并附具安全验算结果，经施工单位技术负责人、总监理工程师签字后实施", "施工单位应当严格按照安全设施设计和相关施工技术标准、规范施工，并对安全设施的工程质量负责", "第十八条施工单位发现安全设施设计文件有错漏的，应当及时向生产经营单位、设计单位提出"]}, {"type": "单选", "chapter": "安全生产部门规章", "section": "第十五节 煤矿安全培训规定", "point": "考点二：安全培训的组织与管理", "options": [{"key": "A", "text": "百分之十"}, {"key": "B", "text": "百分之二十"}, {"key": "C", "text": "百分之三十"}, {"key": "D", "text": "百分之四十"}], "answer": "D", "question": "根据《煤矿安全培训规定》，煤矿企业按照国家规定的比例提取教育培训经费。其中，用于安全培训的资金不得低于教育培训经费总额的（ ）。", "id": 240, "explanation": ["第六条煤矿企业应当建立完善安全培训管理制度，制定年度安全培训计划，明确负责安全培训工作的机构，配备专职或者兼职安全培训管理人员，按照国家规定的比例提取教育培训经费", "其中，用于安全培训的资金不得低于教育培训经费总额的百分之四十", "第七条对从业人员的安全技术培训，具备《安全培训机构基本条件》（AQ/T8011）规定的安全培训条件的煤矿企业应当以自主培训为主，也可以委托具备安全培训条件的机构进行安全培训", "不具备安全培训条件的煤矿企业应当委托具备安全培训条件的机构进行安全培训"]}, {"type": "单选", "chapter": "安全生产部门规章", "section": "第十五节 煤矿安全培训规定", "point": "考点三：主要负责人和安全生产管理人员的安全培训及考核", "options": [{"key": "A", "text": "国家煤矿安全监察局负责中央管理的煤矿企业总部主要负责人和安全生产管理人员考核工作"}, {"key": "B", "text": "考核部门应当在公布考试成绩之日起 30 个工作日内颁发安全生产知识和管理能力考核合格证明"}, {"key": "C", "text": "煤矿企业主要负责人和安全生产管理人员考试不合格的，可以补考一次"}, {"key": "D", "text": "煤矿企业主要负责人和安全生产管理人员经补考仍不合格的，1 年内不得再次申请考核"}], "answer": "B", "question": "根据《煤矿安全培训规定》，下列关于煤矿企业主要负责人和安全生产管理人员考核的说法错误的是（ ）", "id": 241, "explanation": ["1.主要负责人和安全生产管理机构负责人的资历要求", "第十一条煤矿矿长、副矿长、总工程师、副总工程师应当具备煤矿相关专业大专及以上学历，具有三年以上煤矿相关工作经历", "煤矿安全生产管理机构负责人应当具备煤矿相关专业中专及以上学历，具有二年以上煤矿安全生产相关工作经历", "第十二条煤矿企业应当每年组织主要负责人和安全生产管理人员进行新法律法规、新标准、新规程、新技术、新工艺、新设备和新材料等方面的安全培训"]}, {"type": "单选", "chapter": "安全生产部门规章", "section": "第十五节 煤矿安全培训规定", "point": "考点四：特种作业人员的安全培训和考核发证", "options": [{"key": "A", "text": "煤矿特种作业人员在参加资格考试前应当进行安全生产知识和实际操作能力的专门培训"}, {"key": "B", "t     const storeKey = 'zhongan_fagui_quiz_v1';
    let state = JSON.parse(localStorage.getItem(storeKey) || '{}');
    let mode = 'all', typeFilter = 'all', chapterFilter = 'all', keyword = '', randomIds = null;
    const list = document.querySelector('#list');
    const statBox = document.querySelector('#stats');
    const chapterSelect = document.querySelector('#chapter');
    function save(){ localStorage.setItem(storeKey, JSON.stringify(state)); }
    function selected(id){ return state[id]?.selected || []; }
    function isDone(id){ return !!state[id]?.done; }
    function isWrong(id){ return state[id]?.done && !state[id]?.correct; }
    function same(a,b){ return [...a].sort().join('') === [...b].sort().join(''); }
    function filtered(){
      const base = QUESTIONS.filter(q => {
        if(chapterFilter !== 'all' && q.chapter !== chapterFilter) return false;
        if(typeFilter !== 'all' && q.type !== typeFilter) return false;
        if(mode === 'wrong' && !isWrong(q.id)) return false;
        if(mode === 'undone' && isDone(q.id)) return false;
        const hay = `${q.chapter} ${q.section} ${q.point} ${q.question} ${q.options.map(o=>o.text).join(' ')}`;
        return !keyword || hay.toLowerCase().includes(keyword.toLowerCase());
      });
      return randomIds ? base.filter(q => randomIds.includes(q.id)) : base;
    }
    function updateStats(){
      const base = chapterFilter === 'all' ? QUESTIONS : QUESTIONS.filter(q=>q.chapter === chapterFilter);
      const done = base.filter(q=>isDone(q.id)).length;
      const wrong = base.filter(q=>isWrong(q.id)).length;
      const correct = base.filter(q=>state[q.id]?.correct).length;
      const current = filtered();
      let html = `<div class="stat"><span>当前题数</span><strong>${current.length}</strong></div><div class="stat"><span>章节总题</span><strong>${base.length}</strong></div><div class="stat"><span>已做</span><strong>${done}</strong></div><div class="stat"><span>正确</span><strong>${correct}</strong></div><div class="stat"><span>错题</span><strong>${wrong}</strong></div>`;
      if(randomIds){
        const paperDone = current.filter(q=>isDone(q.id)).length;
        const paperCorrect = current.filter(q=>state[q.id]?.correct).length;
        const score = current.length ? Math.round((paperCorrect / current.length) * 100) : 0;
        const title = paperDone === current.length ? '本组最终得分' : '本组当前得分';
        html += `<div class="stat"><span>${title}</span><strong>${score}</strong><span class="muted">${paperCorrect}/${current.length} 正确，已答 ${paperDone}/${current.length}</span></div>`;
      }
      statBox.innerHTML = html;
    }
    function initChapterFilter(){
      const chapters = [...new Set(QUESTIONS.map(q=>q.chapter).filter(Boolean))];
      chapterSelect.innerHTML = '<option value="all">全部章节</option>' + chapters.map(ch => `<option value="${escapeHtml(ch)}">${escapeHtml(ch)}</option>`).join('');
    }
    function render(){
      updateStats();
      const qs = filtered();
      list.innerHTML = qs.map(q => {
        const picked = selected(q.id);
        const done = isDone(q.id);
        const answer = q.answer.split('');
        const opts = q.options.map(o => {
          const checked = picked.includes(o.key) ? 'checked' : '';
          const klass = done && answer.includes(o.key) ? ' correct' : (done && picked.includes(o.key) && !answer.includes(o.key) ? ' wrong' : '');
          const inputType = q.type === '多选' ? 'checkbox' : 'radio';
          return `<label class="option${klass}"><input type="${inputType}" name="q${q.id}" value="${o.key}" ${checked} ${done?'disabled':''}><strong>${o.key}.</strong><span>${escapeHtml(o.text)}</span></label>`;
        }).join('');
        const result = done ? (state[q.id].correct ? '<span class="ok">答对了</span>' : '<span class="bad">答错了</span>') : '<span class="muted">未作答</span>';
        const exp = q.explanation?.length ? `<div><strong>考点依据：</strong><ul>${q.explanation.map(x=>`<li>${highlight(escapeHtml(x))}</li>`).join('')}</ul></div>` : '<div class="muted">讲义未提供可抽取的解析依据，建议回看本题所属考点。</div>';
        return `<article class="card" data-id="${q.id}">
          <div class="meta"><span class="tag ${q.type==='多选'?'multi':''}">${q.type}</span><span>第 ${q.id} 题</span><span>${escapeHtml(q.chapter)}</span><span>${escapeHtml(q.section)}</span><span>${escapeHtml(q.point)}</span></div>
          <div class="question">${escapeHtml(q.question)}</div>
          <div class="options">${opts}</div>
          <button class="primary submit" ${done?'disabled':''}>提交</button>
          <button class="reset-one">重做本题</button>
          <div class="answer ${done?'show':''}">${result}，参考答案：<strong>${q.answer}</strong>${exp}</div>
        </article>`;
      }).join('') || '<div class="card">没有符合条件的题目。</div>';
    }
    function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
    function highlight(s){ return s.replace(/(应当|不得|必须|可以|报告|备案|审查|验收|罚款|停产停业整顿|吊销|关闭|撤职|刑事责任|\d+\s*(?:日|年|小时|万元|个月))/g, '<mark>$1</mark>'); }
    list.addEventListener('change', e => {
      const card = e.target.closest('.card'); if(!card) return;
      const id = card.dataset.id;
      state[id] ||= {};
      state[id].selected = [...card.querySelectorAll('input:checked')].map(i=>i.value);
      save();
    });
    list.addEventListener('click', e => {
      const card = e.target.closest('.card'); if(!card) return;
      const q = QUESTIONS.find(x => String(x.id) === card.dataset.id);
      if(e.target.classList.contains('submit')){
        const picked = [...card.querySelectorAll('input:checked')].map(i=>i.value);
        if(!picked.length){ alert('先选一个答案'); return; }
        state[q.id] = {selected:picked, done:true, correct:same(picked, q.answer.split(''))};
        save(); render();
      }
      if(e.target.classList.contains('reset-one')){
        delete state[q.id]; save(); render();
      }
    });
    function clearRandom(){ randomIds = null; }
    document.querySelector('#type').addEventListener('change', e => {typeFilter=e.target.value; clearRandom(); render();});
    chapterSelect.addEventListener('change', e => {chapterFilter=e.target.value; clearRandom(); render();});
    document.querySelector('#mode').addEventListener('change', e => {mode=e.target.value; clearRandom(); render();});
    document.querySelector('#q').addEventListener('input', e => {keyword=e.target.value.trim(); clearRandom(); render();});
    document.querySelector('#resetAll').addEventListener('click', () => { if(confirm('清空所有做题记录？')){state={}; save(); render();}});
    document.querySelector('#shuffle').addEventListener('click', () => {clearRandom(); QUESTIONS.sort(()=>Math.random()-0.5); render();});
    document.querySelector('#random20').addEventListener('click', () => {
      clearRandom();
      const pool = filtered().map(q => q.id).sort(() => Math.random() - 0.5);
      randomIds = pool.slice(0, 20);
      render();
    });
    document.querySelector('#clearRandom').addEventListener('click', () => {clearRandom(); render();});
    initChapterFilter();
    render();
    </script>
