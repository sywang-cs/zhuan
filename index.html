<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中安法规复习站</title>
<style>
  :root{
    --ink:#17324d;
    --muted:#587184;
    --line:#c9e7ee;
    --bg:#f3fbff;
    --panel:#ffffff;
    --teal:#28a889;
    --blue:#3f8fd2;
    --amber:#c98726;
    --soft:#e7f8f2;
  }
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,#eaf8ff 0,#f4fcf8 270px,#f8fbff 100%);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{background:linear-gradient(135deg,#7cc7ee 0%,#a9e6d0 58%,#fff0b8 100%);color:#fff;padding:34px 18px 42px;border-bottom:1px solid #bfe9ef}
  .wrap{max-width:980px;margin:0 auto}
  h1{margin:0;font-size:34px;letter-spacing:0;text-shadow:0 2px 10px rgba(28,100,145,.22)}
  header p{margin:8px 0 0;color:#f7feff}
  main{max-width:980px;margin:-20px auto 0;padding:22px 14px 70px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
  .card{display:flex;flex-direction:column;min-height:200px;padding:18px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.92);text-decoration:none;color:inherit;box-shadow:0 12px 28px rgba(63,143,210,.10)}
  .card:hover{border-color:#81d8c2;box-shadow:0 16px 34px rgba(40,168,137,.16);transform:translateY(-1px)}
  .tag{display:inline-flex;width:max-content;border-radius:999px;padding:3px 10px;font-size:13px;background:#e4f6ff;color:#2476aa;font-weight:700}
  .tag.blue{background:#e7f8f2;color:#168267}
  .tag.amber{background:#fff4c9;color:var(--amber)}
  h2{margin:14px 0 8px;font-size:22px}
  .card p{margin:0;color:var(--muted)}
  .go{margin-top:auto;padding-top:18px;color:#168267;font-weight:800}
  .note{margin-top:18px;padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted);box-shadow:0 10px 24px rgba(63,143,210,.08)}
</style>
<header>
  <div class="wrap">
    <h1>子瑜皇上御用中安法规复习圣殿</h1>
    <p>愿英明神武的子瑜皇上刷题如开卷，背点如有神，逢考必会，落笔全对。</p>
  </div>
</header>
<main>
  <section class="grid">
    <a class="card" href="quiz.html">
      <span class="tag">刷题</span>
      <h2>选择题练习</h2>
      <p>251 道选择题，支持章节筛选、错题、随机 20 题、分数统计和考点依据。</p>
      <span class="go">开始刷题</span>
    </a>
    <a class="card" href="points.html">
      <span class="tag blue">背诵</span>
      <h2>考点速背</h2>
      <p>按章节和考点整理高频规定，重点词高亮，适合考前快速过一遍。</p>
      <span class="go">查看考点</span>
    </a>
    <a class="card" href="mindmap.html">
      <span class="tag amber">框架</span>
      <h2>详细思维导图</h2>
      <p>章、节、考点、关键规定逐层展开，适合先搭框架再补细节。</p>
      <span class="go">打开导图</span>
    </a>
  </section>
  <section class="note">
    建议顺序：先看思维导图建立框架，再看考点速背，最后用随机 20 题检验。
  </section>
</main>
</html>
