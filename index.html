"有关法律、行政法规、地方性法规对金属冶炼安全另有规定的，适用其规定"}], "answer": "B", "question": "《安全生产法》对其适用范围作了明确的规定，下列关于其排除适用的说法，正确的是（ ）。", "id": 4, "explanation": ["第二条在中华人民共和国领域内从事生产经营活动的单位（以下统称生产经营单位）的安全生产，适用本法；"]}, {"type": "单选", "chapter": "中华人民共和国安全生产法", "section": "第二节 基本规定", "point": "考点五：安全生产工作的机制", "options": [{"key": "A", "text": "生产经营单位负责、职工参与、政府监管、行业自律、社会监督"}, {"key": "B", "text": "生产经营单位负责、社会监督、行业自律、工会监管、职工参与"}, {"key": "C", "text": "生产经营单位负责、职工自律、工会监督、社会参与、行业监管"}, {"key": "D", "text": "生产经营单位负责、国家监察、职工参与、社会监督、行业自律"}], "answer": "A", "question": "根据《安全生产法》的规定，我国安全生产的工作机制是一个从内部到外部，从生产经营单位到政府、社会、行业参与安全生产的全方位工作格局。我国的安全生产工作机制是（ ）", "id": 5, "explanation": ["第三条第三款强化和落实生产经营单位主体责任与政府监管责任，建立生产经营单位负责、职工参与、政府监管、行业自律和社会监督的机制"]}, {"type": "单选", "chapter": "中华人民共和国安全生产法", "section": "第二节 基本规定", "point": "考点七：生产经营单位主要负责人的安全责任", "options": [{"key": "A", "text": "董事长周某"}, {"key": "B", "text": "副总经理黄某"}, {"key": "C", "text": "总经理王某"}, {"key": "D", "text": "专职安全员高某"}], "answer": "B", "question": "2016 年 4 月 25 日，某服装公司发生火灾，造成 20 人死亡，45 人受伤，该公司董事长周某年龄比较大，因患病常年在医院接受治疗，不能主持该公司的日常工作。公司总经理王某于 2012 年 6 月出国参加学习一直未归，王某出国期间，由公司副总经理黄某全面主持工作，公司还配备一名专职的安全员高某负责现场安全监督管理工作。根据《安全生产法》，针对该事故，该公司应当被追究法律责任的主要负责人是（ ）。", "id": 6, "explanation": ["第五条生产经营单位的主要负责人是本单位安全生产第一责任人，对本单位的安全生产工作全面负责", "其他负责人对职责范围内的安全生产工作负责", "比较大，因患病常年在医院接受治疗，不能主持该公司的日常工作", "公司总经理王某于2012年6月出国参加学习一直未归，王某出国期间，由公司副总经理黄某全面主持工作，公司还配备一名专职的安全员高某负责现场安全监督管理工作"]}, {"type": "多选", "chapter": "中华人民共和国安全生产法", "section": "第二节 基本规定", "point": "考点八：其他负责人的地位和安全生产责任", "options": [{"key": "A", "text": "责令限期改正，处一万元以上三万元以下的罚款"}, {"key": "B", "text": "暂停或者吊销其与安全生产有关的资格"}, {"key": "C", "text": "导致发生生产安全事故的，处上一年年收入百分之二十以上百分之五十以下的罚款"}, {"key": "D", "text": "构成犯罪的，依照刑法有关规定追究刑事责任"}, {"key": "E", "text": "处上一年年收入百分之八十的罚款"}], "answer": "ACD", "question": "根据《安全生产法》，关于安全生产管理人员未履行安全生产管理职责的处罚，下列说法正确的是（ ）。", "id": 7, "explanation": ["第九十六条生产经营单位的其他负责人和安全生产管理人员未履行本法规定的安全生产管理职责的，责令限期改正，处一万元以上三万元以下的罚款；", "导致发生生产安全事故的，暂停或者吊销其与安全生产有关的资格，并处上一年年收入百分之二十以上百分之五十以下的罚款；", "构成犯罪的，依照刑法有关规定追究刑事责任"]}, {"type": "单选", "chapter": "中华人民共和国安全生产法", "section": "第二节 基本规定", "point": "考点九：工会在安全生产工作中的地位和权利", "options": [{"key": "A", "text": "对建设项目的安全设施与主体工程同时设计、同时施工、同时投入生产和使用进行监督，提出意见"}, {"key": "B", "text": "对生产经营单位违反安全生产法律、法规，侵犯从业人员合法权益的行为，有权要求纠正"}, {"key": "C", "text": "发现生产经营单位违章指挥、强令冒险作业或者发现事故隐患时，有权提出解决的建议，生产经营单位应当及时研究答复"}, {"key": "D", "text": "发现危及从业人员生命安全的情况时，有权组织从业人员撤离危险场所"}], "answer": "D", "question": "根据《中华人民共和国安全生产法》，关于工会的安全生产权利,说法错误的是（ ）。", "id": 8, "explanation": ["生产经营单位制定或者修改有关安全生产的规章制度，应当听取工会的意见", "发现生产经营单位违章指挥、强令冒险作业或者发现事故隐患时，有权提出解决的建议，生产经营单位应当及时研究答复；", "发现危及从业人员生命安全的情况时，有权向生产经营单位建议组织从业人员撤离危险场所，生产经营单位必须立即作出处理", "工会有权依法参加事故调查，向有关部门提出处理意见，并要求追究有关人员的责任"]}, {"type": "单选", "chapter": "中华人民共和国安全生产法", "section": "第二节 基本规定", "point": "考点十二：安全生产综合监管部门与专项监管部门的职责分工", "options": [{"key": "A", "text": "各级人民政府应当根据国民经济和社会发展规划制定安全生产规划，并组织实施"}, {"key": "B", "text": "县级以上人民政府应当对安全生产工作实施综合监督管理，所需经费列入本级预算"}, {"key": "C", "text": "地方各级人民政府应当组织有关部门建立完善安全风险评估与论证机制，按照安全风险管控要求，进行产业规划和空间布局，并对位置相邻、行业相近、业态相似的生产经营单位实施重大安全风险联防联控"}, {"key": "D", "text": "国务院和县级以上地方各级人民政府应当加强对安全生产工作的领导，建立健全安全生产工作协调机制，支持、督促各有关部门依法履行安全生产监督管理职责，及时协调、解决安全生产监督管理中存在的重大问题"}], "answer": "D", "question": "根据《安全生产法》，关于人民政府的安全生产职责，下列说法正确的是（ ）。", "id": 9, "explanation": ["县级以上地方各级人民政府应急管理部门依照本法，对本行政区域内安全生产工作实施综合监督管理", "县级以上地方各级人民政府有关部门依照本法和其他有关法律、法规的规定，在各自的职责范围内对有关行业、领域的安全生产工作实施监督管理", "对新兴行业、领域的安全生产监督管理职责不明确的，由县级以上地方各级人民政府按照业务相近的原则确定监督管理部门", "负有安全生产监督管理职责的部门应当相互配合、齐抓共管、信息共享、资源共用，依法加强安全生产监督管理工作"]}, {"type": "多选", "chapter": "中华人民共和国安全生产法", "section": "第二节 基本规定", "point": "考点十五：安全生产标准", "options": [{"key": "A", "text": "项目提出"}, {"key": "B", "text": "对外通报"}, {"key": "C", "text": "组织起草"}, {"key": "D", "text": "技术审查"}, {"key": "E", "text": "立项计划"}], "answer": "ACD", "question": "下列选项中关于安全生产强制性国家标准属于国务院有关部门按照职责分工负责的有（ ）。", "id": 10, "explanation": ["第十一条国务院有关部门应当按照保障安全生产的要求，依法及时制定有关的国家标准或者行业标准，并根据科技进步和经济发展适时修订", "生产经营单位必须执行依法制定的保障安全生产的国家标准或者行业标准", "第十二条国务院有关部门按照职责分工负责安全生产强制性国家标准的项目提出、组织起草、征求意见、技术审查", "国务院标准化行政主管部门负责安全生产强制性国家标准的立项、编号、对外通报和授权批准发布工作"]}, {"type": "多选", "chapter": "中华人民共和国安全生产法", "section": "第三节 生产经营单位的安全生产保障", "point": "考点二：生产经营单位主要负责人的安全生产职责", "options": [{"key": "A", "text": "组织开展危险源辨识和评估"}, {"key": "B", "text": "组织制定并实施本单位安全生产规章制度和操作规程"}, {"key": "C", "text": "保证本单位安全生产投入的有效实施"}, {"key": "D", "text": "检查本单位的安全生产状况，及时排查生产安全事故隐患，提出改进安全生产管理的建议"}, {"key": "E", "text": "督促落实本单位安全生产整改措施"}], "answer": "BC", "question": "依据《安全生产法》，下列属于生产经营单位主要负责人职责的是（ ）。", "id": 11, "explanation": ["第二十一条生产经营单位的主要负责人对本单位安全生产工作负有下列职责:", "（3）组织制定并实施本单位安全生产教育和培训计划；", "（5）组织建立并落实安全风险分级管控和隐患排查治理双重预防工作机制，督促、检查本单位的安全生产工作，及时消除生产安全事故隐患；", "（6）组织制定并实施本单位的生产安全事故应急救援预案；"]}, {"type": "单选", "chapter": "中华人民共和国安全生产法", "section": "第三节 生产经营单位的安全生产保障", "point": "考点三：安全生产资金投入的规定", "options": [{"key": "A", "text": "董事会"}, {"key": "B", "text": "董事长"}, {"key": "C", "text": "股东"}, {"key": "D", "text": "总经理"}], "answer": "A", "question": "根据《安全生产法》，某股份制公司安全生产条件所必需的资金投入，应由（ ）予以保证。", "id": 12, "explanation": ["第二十三条生产经营单位应当具备的安全生产条件所必需的资金投入，由生产经营单位的决策机构、主要负责人或者个人经营的投资人予以保证，并对由于安全生产所必需的资金投入不足导致的后果承担责任", "有关生产经营单位应当按照规定提取和使用安全生产费用，专门用于改善安全生产条件", "安全生产费用提取、使用和监督管理的具体办法由国务院财政部门会同国务院应急管理部门征求国务院有关部门意见后制定", "知识延伸（1）股份制公司、有限责任公司，由其决策机构董事会或者股东会决定安全投入的资金"]}, {"type": "单选", "chapter": "中华人民共和国安全生产法", "section": "第三节 生产经营单位的安全生产保障", "point": "考点三：安全生产资金投入的规定", "options": [{"key": "A", "text": "安全生产费用为专项资金，不必列入成本"}, {"key": "B", "text": "生产经营单位提取的安全生产费用，专门用于改善安全生产条件和职工福利待遇"}, {"key": "C", "text": "有关生产经营单位应当按照规定提取和使用安全生产费用"}, {"key": "D", "text": "生产经营单位的安全生产管理人员对由于安全生产所必需的资金投入不足导致的后果承担责任"}], "answer": "C", "question": "依据《安全生产法》，下列关于安全生产资金投入的说法正确的是（ ）。", "id": 13, "explanation": ["第二十三条生产经营单位应当具备的安全生产条件所必需的资金投入，由生产经营单位的决策机构、主要负责人或者个人经营的投资人予以保证，并对由于安全生产所必需的资金投入不足导致的后果承担责任", "有关生产经营单位应当按照规定提取和使用安全生产费用，专门用于改善安全生产条件", "安全生产费用提取、使用和监督管理的具体办法由国务院财政部门会同国务院应急管理部门征求国务院有关部门意见后制定", "知识延伸（1）股份制公司、有限责任公司，由其决策机构董事会或者股东会决定安全投入的资金"]}, {"type": "多选", "chapter": "中华人民共和国安全生产法", "section": "第三节 生产经营单位的安全生产保障", "point": "考点四：安全生产管理机构和安全生产管理人员的要求", "options": [{"key": "A", "text": "某道路运输单位从业人员 50 人，没有设置安全生产管理机构，配备了 2 名兼职安全生产管理人员"}, {"key": "B", "text": "某煤矿企业从业人员 62 人，设置了安全生产管理机构和 4 名兼职安全生产管理人员"}, {"key": "C", "text": "某服装加工厂从业人员 98 人，没有设置安全生产管理机构，配备了 3 名专职安全生产管理人员"}, {"key": "D", "text": "某食品加工厂从业人员 200 人，没有设置安全生产管理机构和安全生产管理人员，委托机构管理安全生产工作"}, {"key": "E", "text": "某危险化学品生产企业从业人员 120 人，设置了安全生产管理机构和 3 名专职安全生产管理人员"}], "answer": "BCE", "question": "生产经营单位应当具备必要的安全保障，依据《安全生产法》，在安全生产管理机构的设置和安全生产管理人员的配备上，下列做法符合要求的是（ ）。", "id": 14, "explanation": ["第二十四条矿山、金属冶炼、建筑施工、运输单位和危险物品的生产、经营、储存、装卸单位，应当设置安全生产管理机构或者配备专职安全生产管理人员", "前款规定以外的其他生产经营单位，从业人员超过一百人的，应当设置安全生产管理机构或者配备专职安全生产管理人员；", "从业人员在一百人以下的，应当配备专职或者兼职的安全生产管理人员", "（1）组织或者参与拟订本单位安全生产规章制度、操作规程和生产安全事故应急救援预案；"]}, {"type": "单选", "chapter": "中华人民共和国安全生产法", "section": "第三节 生产经营单位的安全生产保障", "point": "考点六：关于注册安全工程师的规定", "options": [{"key": "A", "text": "生产经营单位作出涉及安全生产的经营决策，可以听取安全生产管理机构以及安全生产管理人员的意见"}, {"key": "B", "text": "生产经营单位因为采取了安全生产管理人员的建议更换了新设备，增加了经营成本，所以降低了安全生产管理人员的工资"}, {"key": "C", "text": "金属冶炼单位辞退了一名安全生产管理人员，没有告知主管的负有安全生产监督管理职责的部门"}, {"key": "D", "text": "建筑施工单位聘用了一名安全生产管理人员，没有告知主管的负有安全生产监督管理职责的部门"}], "answer": "D", "question": "《安全生产法》关于安全生产管理机构以及安全生产管理人员的做法，正确的是（ ）。", "id": 15, "explanation": ["第二十七条第三款危险物品的生产、储存、装卸单位以及矿山、金属冶炼单位应当有注册安全工程师从事安全生产管理工作", "注册安全工程师按专业分类管理，具体办法由国务院人力资源和社会保障部门、国务院应急管理部门会同国务院有关部门制定", "法律主体法律要求金矿危安全生产管理人员的任免，应当告知主管的负有安全（生产、储存）生产监督管理职责的部门金矿危（生产、储存、装卸）应当有注册安全工程师从事安全生产管理工作金矿建危（生产、经营、储存、装卸单位）运设置安全管理机构或配备专职安全管理人员主要负责人和安全生产管理人员，应当由主管部门对其安全生产知识和管理能力考核合格"]}, {"type": "单选", "chapter": "中华人民共和国安全生产法", "section": "第三节 生产经营单位的安全生产保障", "point": "考点七：从业人员安全生产教育和培训的规定", "options": [{"key": "A", "text": "该企业接收的实习生，由学校负责进行相应的安全生产教育培训，企业应当协助学校按规定开展教育培训"}, {"key": "B", "text": "该企业对被派遣劳动者与本企业从业人员统一实施安全教育培训，并保证相同岗位的考核标准一致"}, {"key": "C", "text": "该企业面向社会招聘的技术人员，具有同类工作经验的，上岗前可不要求进行安全教育培训"}, {"key": "D", "text": "该企业对新入厂的各类人员，必须按照统一的时间、内容和考核标准，经过安全生产教育培训后，方可上岗"}], "answer": "B", "question": "某玩具生产企业因业务高速增长，通过多种渠道扩大员工规模，包括面向高校招收应届毕业生、面向社会招聘技术人员、使用被派遣劳动者、接收实习生等。根据《安全生产法》，关于有关人员安全生产教育培训的说法，正确的是（ ）。", "id": 16, "explanation": ["第二十八条生产经营单位应当对从业人员进行安全生产教育和培训，保证从业人员具备必要的安全生产知识，熟悉有关的安全生产规章制度和安全操作规程，掌握本岗位的安全操作技能，了解事故应急处理措施，知悉自身在安全生产方面的权利和义务", "未经安全生产教育和培训合格的从业人员，不得上岗作业", "生产经营单位使用被派遣劳动者的，应当将被派遣劳动者纳入本单位从业人员统一管理，对被派遣劳动者进行岗位安全操作规程和安全操作技能的教育和培训", "劳务派遣单位应当对被派遣劳动者进行必要的安全生产教育和培训"]}, {"type": "单选", "chapter": "中华人民共和国安全生产法", "section": "第三节 生产经营单位的安全生产保障", "point": "考点九：关于建设项目安全的规定", "options": [{"key": "A", "text": "矿山建设项目"}, {"key": "B", "text": "金属冶炼建设项目"}, {"key": "C", "text": "装卸危险物品的建设项目"}, {"key": "D", "text": "道路运输建设项目"}], "answer": "D", "question": "根据《中华人民共和国安全生产法》，下列建设项目中应当按照国家有关规定进行安全评价的不包括（ ）。", "id": 17, "explanation": ["第三十一条生产经营单位新建、改建、扩建工程项目（以下统称建设项目）的安全设施，必须与主体工程同时设计、同时施工、同时投入生产和使用", "安全设施投资应当纳入建设项目概算", "（二）高危建设项目的安全评价", "第三十二条矿山、金属冶炼建设项目和用于生产、储存、装卸危险物品的建设项目，应当按照国家有关规定进行安全评价"]}, {"type": "单选", "chapter": "中华人民共和国安全生产法", "section": "第三节 生产经营单位的安全生产保障", "point": "考点十二：特种设备的规定", "options": [{"key": "A", "text": "必须按照国家有关规定，由专业生产单位生产"}, {"key": "B", "text": "经具有专业资质的检测、检验机构检测、检验合格"}, {"key": "C", "text": "取得安全使用证或者安全标志，方可投入使用"}, {"key": "D", "text": "检测、检验机构对检测、检验结果不负责"}], "answer": "D", "question": "关于生产经营单位使用的危险物品的容器、运输工具，以及涉及人身安全、危险性较大的海洋石油开采特种设备和矿山井下特种设备的要求，不正确的是（ ）。", "id": 18, "explanation": ["第三十七条生产经营单位使用的危险物品的容器、运输工具，以及涉及人身安全、危险性较大的海洋石油开采特种设备和矿山井下特种设备，必须按照国家有关规定，由专业生产单位生产，并经具有专业资质的检测、检验机构检测、检验合格，取得安全使用证或者安全标志，方可投入使用", "检测、检验机构对检测、检验结果负责"]}, {"type": "单选", "chapter": "中华人民共和国安全生产法", "section": "第三节 生产经营单位的安全生产保障", "point": "考点十六：关于风险分级管控和事故隐患排查治理的规定", "options": [{"key": "A", "text": "对检查中发现的安全问题，向本单位有关负责人报告，有关负责人不及时处理的，可以向主管的负有安全生产监督管理职责的部门报告"}, {"key": "B", "text": "对检查中发现的安全问题，应当立即处理，不能处理的，应当及时报告本单位有关负责人"}, {"key": "C", "text": "对检查中发现的重大事故隐患，应当立即处理，同时向主管的负有安全生产监督管理职责的部门报告"}, {"key": "D", "text": "对检查中发现的重大事故隐患，应当立即处理，不能处理的，向主管的负有安全生产监督管理职责的部门报告"}], "answer": "B", "question": "生产经营单位的安全生产管理人员应当根据本单位的生产经营特点，对安全生产状况进行经常性检查。根据《安全生产法》的规定，下列安全生产管理人员的做法，正确的是（ ）。", "id": 19, "explanation": ["第四十一条生产经营单位应当建立安全风险分级管控制度，按照安全风险分级采取相应的管控措施", "生产经营单位应当建立健全并落实生产安全事故隐患排查治理制度，采取技术、管理措施，及时发现并消除事故隐患", "事故隐患排查治理情况应当如实记录，并通过职工大会或者职工代表大会、信息公示栏等方式向从业人员通报", "其中，重大事故隐患排查治理情况应当及时向负有安全生产监督管理职责的部门和职工大会或者职工代表大会报告"]}, {"type": "单选", "chapter": "中华人民共和国安全生产法", "section": "第三节 生产经营单位的安全生产保障", "point": "考点十七：生产设施、场所安全距离和紧急疏散的规定", "options": [{"key": "A", "text": "为了扩大生产，该公司将员工宿舍一楼改建为产品生产车间"}, {"key": "B", "text": "由于员工宿舍一楼有闲置房间，因此公司利用该房间零售自产产品"}, {"key": "C", "text": "公司计划进行扩建，临时将部分成品存放在员工宿舍中无人居住的房间内"}, {"key": "D", "text": "公司在生产区和员工宿舍区开设了通勤车，方便员工上下班"}], "answer": "D", "question": "根据《安全生产法》，下列关于某危险物品公司的说法符合要求的是（ ）。", "id": 20, "explanation": ["第四十二条生产、经营、储存、使用危险物品的车间、商店、仓库不得与员工宿舍在同一座建筑物内，并应当与员工宿舍保持安全距离", "生产经营场所和员工宿舍应当设有符合紧急疏散要求、标志明显、保持畅通的出口、疏散通道", "第一百零五条生产经营单位有下列行为之一的，责令限期改正，处五万元以下的罚款，对其直接负责的主管人员和其他直接责任人员处一万元以下的罚款；", "逾期未改正的，责令停产停业整顿；"]}, {"type": "单选", "chapter": "中华人民共和国安全生产法", "section": "第三节 生产经营单位的安全生产保障", "point": "考点十八：爆破、吊装、动火、临时用电等危险作业现场安全管理的规定", "options": [{"key": "A", "text": "生产经营单位应当安排专门人员进行现场安全管理"}, {"key": "B", "text": "生产经营单位应当安排专职安全生产管理人员进行现场安全管理"}, {"key": "C", "text": "县级人民政府应急管理部门应当安排专门人员进行现场安全管理"}, {"key": "D", "text": "县级人民政府应急管理部门应当安排专职安全管理人员进行现场安全管理"}], "answer": "A", "question": "某建筑施工企业因施工需要进行吊装作业，关于吊装作业现场安全管理的说法，正确的是（ ）。", "id": 21, "explanation": ["第四十三条生产经营单位进行爆破、吊装、动火、临时用电以及国务院应急管理部门会同国务院有关部门规定的其他危险作业，应当安排专门人员进行现场安全管理，确保操作规程的遵守和安全措施的落实"]}, {"type": "单选", "chapter": "中华人民共和国安全生产法", "section": "第三节 生产经营单位的安全生产保障", "point": "考点二十一：交叉作业的安全管理", "options": [{"key": "A", "text": "甲公司和乙企业可以不签订安全生产管理协议，口头约定各自的安全生产管理职责"}, {"key": "B", "text": "甲公司和乙企业应当签订安全生产管理协议，明确各自的职责"}, {"key": "C", "text": "甲公司和乙企业所在地的应急管理部门应当派专人，负责甲、乙交叉作业的安全管理"}, {"key": "D", "text": "甲公司和乙企业应当指定兼职安全生产管理人员进行安全检查与协调"}], "answer": "B", "question": "甲建筑公司和乙煤矿企业在同一作业区域内进行生产经营活动，可能危及对方生产安全。依据《安全生产法》的规定，下列说法正确的是（ ）。", "id": 22, "explanation": ["第四十八条两个以上生产经营单位在同一作业区域内进行生产经营活动，可能危及对方生产安全的，应当签订安全生产管理协议，明确各自的安全生产管理职责和应当采取的安全措施，并指定专职安全生产管理人员进行安全检查与协调"]}, {"type": "单选", "chapter": "中华人民共和国安全生产法", "section": "第三节 生产经营单位的安全生产保障", "point": "考点二十二：生产经营项目、场所、设备发包或者出租的安全管理", "options": [{"key": "A", "text": "该建筑施工企业应当具备安全生产条件和相应资质"}, {"key": "B", "text": "双方应当签订专门的安全生产管理协议，约定各自的安全生产管理职责"}, {"key": "C", "text": "双方应当签订专门的安全生产管理协议，或者在承包合同中约定各自的安全生产管理职责"}, {"key": "D", "text": "该食品加工厂应当对建筑施工企业的安全生产工作定期进行安全检查，发现安全问题的，应当及时督促整改"}], "answer": "B", "question": "某食品加工厂需要扩建厂房，将该工程发包给某建筑施工企业，依据《安全生产法》，下列关于上述两个企业的说法，错误的是（ ）。", "id": 23, "explanation": ["第四十九条生产经营单位不得将生产经营项目、场所、设备发包或者出租给不具备安全生产条件或者相应资质的单位或者个人", "生产经营项目、场所发包或者出租给其他单位的，生产经营单位应当与承包单位、承租单位签订专门的安全生产管理协议，或者在承包合同、租赁合同中约定各自的安全生产管理职责；", "生产经营单位对承包单位、承租单位的安全生产工作统一协调、管理，定期进行安全检查，发现安全问题的，应当及时督促整改", "矿山、金属冶炼建设项目和用于生产、储存、装卸危险物品的建设项目的施工单位应当加强对施工项目的安全管理，不得倒卖、出租、出借、挂靠或者以其他形式非法转让施工资质，不得将其承包的全部建设工程转包给第三人或者将其承包的全部建设工程支解以后以分包的名义分别转包给第三人，不得将工程分包给不具备相应资质条件的单位"]}, {"type": "单选", "chapter": "中华人民共和国安全生产法", "section": "第三节 生产经营单位的安全生产保障", "point": "考点二十二：生产经营项目、场所、设备发包或者出租的安全管理", "options": [{"key": "A", "text": "甲公司"}, {"key": "B", "text": "乙公司"}, {"key": "C", "text": "丙公司"}, {"key": "D", "text": "王某"}], "answer": "A", "question": "甲公司将其施工项目发包给具备相应资质的乙公司，乙公司将其中部分业务分包给不具备资质的丙公司，丙公司又转包给挂靠在丁公司的王某。依据《安全生产法》的规定，做法正确的是（ ）。", "id": 24, "explanation": ["第四十九条生产经营单位不得将生产经营项目、场所、设备发包或者出租给不具备安全生产条件或者相应资质的单位或者个人", "生产经营项目、场所发包或者出租给其他单位的，生产经营单位应当与承包单位、承租单位签订专门的安全生产管理协议，或者在承包合同、租赁合同中约定各自的安全生产管理职责；", "生产经营单位对承包单位、承租单位的安全生产工作统一协调、管理，定期进行安全检查，发现安全问题的，应当及时督促整改", "矿山、金属冶炼建设项目和用于生产、储存、装卸危险物品的建设项目的施工单位应当加强对施工项目的安全管理，不得倒卖、出租、出借、挂靠或者以其他形式非法转让施工资质，不得将其承包的全部建设工程转包给第三人或者将其承包的全部建设工程支解以后以分包的名义分别转包给第三人，不得将工程分包给不具备相应资质条件的单位"]}, {"type": "单选", "chapter": "中华人民共和国安全生产法", "section": "第三节 生产经营单位的安全生产保障", "point": "考点二十四：工伤保险和安全生产责任保险的规定", "options": [{"key": "A", "text": "所有的生产经营单位都应当依法为从业人员投保安全生产责任保险，为从业人员缴纳保险费"}, {"key": "B", "text": "有关单位未按照国家规定投保安全生产责任保险的，应当责令限期改正，并处十万元以上二十万元以下的罚款"}, {"key": "C", "text": "有关单位未按照国家规定投保安全生产责任保险且逾期未改正的，处十万元以上二十万元以下的罚款"}, {"key": "D", "text": "有关单位未按照国家规定投保安全生产责任保险且逾期未改正的，应对主要负责人予以拘留"}], "answer": "C", "question": "根据《安全生产法》的规定，下列关于安全生产责任保险的说法，正确的是（ ）。", "id": 25, "explanation": ["第五十二条第一款生产经营单位与从业人员订立的劳动合同，应当载明有关保障从业人员劳动安全、防止职业危害的事项，以及依法为从业人员办理工伤保险的事项", "第五十一条生产经营单位必须依法参加工伤保险，为从业人员缴纳保险费", "属于国家规定的高危行业、领域的生产经营单位，应当投保安全生产责任保险", "具体范围和实施办法由国务院应急管理部门会同国务院财政部门、国务院保险监督管理机构和相关行业主管部门制定"]}, {"type": "单选", "chapter": "中华人民共和国安全生产法", "section": "第四节 从业人员的安全生产权利和义务", "point": "考点一：从业人员的人身保障权利", "options": [{"key": "A", "text": "签署的免责条款无效"}, {"key": "B", "text": "发生事故后，小张应该立即申请工伤鉴定"}, {"key": "C", "text": "发生工伤后，小张只能在工伤保险和单位赔偿任选其一"}, {"key": "D", "text": "该机械厂的主要负责人将面临五万元以上十万元以下的罚款"}], "answer": "A", "question": "小张到某机械厂上班，因工作失误导致手指被压断，申请工伤时，单位以劳动合同当中的免责条款拒绝给小张申请工伤，根据《安全生产法》，关于小张安全生产权利和义务的说法，正确的是（）。", "id": 26, "explanation": ["第五十二条生产经营单位与从业人员订立的劳动合同，应当载明有关保障从业人员劳动安全、防止职业危害的事项，以及依法为从业人员办理工伤保险的事项", "生产经营单位不得以任何形式与从业人员订立协议，免除或者减轻其对从业人员因生产安全事故伤亡依法应承担的责任", "第一百零六条生产经营单位与从业人员订立协议，免除或者减轻其对从业人员因生产安全事故伤亡依法应承担的责任的，该协议无效；", "对生产经营单位的主要负责人、个人经营的投资人处二万元以上十万元以下的罚款"]}, {"type": "单选", "chapter": "中华人民共和国安全生产法", "section": "第四节 从业人员的安全生产权利和义务", "point": "考点二：从业人员的安全生产义务", "options": [{"key": "A", "text": "发现直接危及人身安全的紧急情况时，从业人员应当抢救有关设备后立即撤离作业现场"}, {"key": "B", "text": "从业人员有权拒绝接受生产经营单位提供的安全生产教育培训"}, {"key": "C", "text": "从业人员发现事故隐患，立即报告现场安全管理人员或者本单位负责人"}, {"key": "D", "text": "从业人员受到事故伤害获得工伤保险后，不再享有获得民事赔偿的权利"}], "answer": "C", "question": "根据《安全生产法》，从业人员安全生产权利与义务包括（）。", "id": 27, "explanation": ["第五十七条从业人员在作业过程中，应当严格落实岗位安全责任，遵守本单位的安全生产规章制度和操作规程，服从管理，正确佩戴和使用劳动防护用品", "（2）接受安全培训，掌握安全生产技能的义务", "第五十八条从业人员应当接受安全生产教育和培训，掌握本职工作所需的安全生产知识，提高安全生产技能，增强事故预防和应急处理能力", "（3）发现事故隐患或者其他不安全因素及时报告的义务"]}, {"type": "单选", "chapter": "中华人民共和国安全生产法", "section": "第五节 安全生产的监督管理", "point": "考点二：负有安全生产监督管理职责的部门依法监督检查时行使的职权", "options": [{"key": "A", "text": "进入生产经营单位进行检查，调阅有关资料"}, {"key": "B", "text": "对检查中发现的安全生产违法行为，当场予以纠正或者要求限期改正"}, {"key": "C", "text": "对检查中发现的事故隐患，责令立即排除"}, {"key": "D", "text": "要求被检查单位暂停生产配合检查"}], "answer": "D", "question": "根据《安全生产法》，应急管理部门和其他负有安全生产监督管理职责的部门在对生产经营单位进行监督检查时，可行使的职权不包括（）。", "id": 28, "explanation": ["第六十五条应急管理部门和其他负有安全生产监督管理职责的部门依法开展安全生产行政执法工作，对生产经营单位执行有关安全生产的法律、法规和国家标准或者行业标准的情况进行监督检查，行使以下职权:", "对依法应当给予行政处罚的行为，依照本法和其他有关法律、行政法规的规定作出行政处罚决定；", "（三）对检查中发现的事故隐患，应当责令立即排除；", "重大事故隐患排除前或者排除过程中无法保证安全的，应当责令从危险区域内撤出作业人员，责令暂时停产停业或者停止使用相关设施、设备；"]}, {"type": "单选", "chapter": "中华人民共和国安全生产法", "section": "第五节 安全生产的监督管理", "point": "考点三：安全生产监督检查的要求", "options": [{"key": "A", "text": "安全生产监督检查人员应当将检查相关情况作出书面记录，并由检查人员和被检查单位的负责人签字；被检查单位的负责人拒绝签字的，应当要求其签署拒绝签字的证明文件"}, {"key": "B", "text": "安全生产监督检查人员执行监督检查任务时，必须出示有效的监督执法证件；对涉及被检查单位的技术秘密和业务秘密，应当为其保密"}, {"key": "C", "text": "生产经营单位对负有安全生产监督管理职责的部门的监督检查人员依法履行监督检查职责，应当予以配合，不得拒绝、阻挠"}, {"key": "D", "text": "负有安全生产监督管理职责的部门在监督检查中，应当互相配合，实行联合检查"}], "answer": "A", "question": "依据《安全生产法》，下列关于安全生产监督管理的说法，错误的是（）。", "id": 29, "explanation": ["第六十七条安全生产监督检查人员应当忠于职守，坚持原则，秉公执法", "安全生产监督检查人员执行监督检查任务时，必须出示有效的行政执法证件；", "对涉及被检查单位的技术秘密和业务秘密，应当为其保密", "第六十八条安全生产监督检查人员应当将检查的时间、地点、内容、发现的问题及其处理情况，作出书面记录，并由检查人员和被检查单位的负责人签字；"]}, {"type": "单选", "chapter": "中华人民共和国安全生产法", "section": "第五节 安全生产的监督管理", "point": "考点五：对拒不执行执法决定实施停电停供民用爆炸物品措施的规定", "options": [{"key": "A", "text": "企业拒不执行行政处罚决定，执法人员可立即通知供电单位停止给其供电"}, {"key": "B", "text": "执法人员对企业采取停止供电措施前，应征得本部门主要负责人的批准，经批准便可电话通知供电单位停止通电"}, {"key": "C", "text": "负有安全生产监督管理职责的部门依法采取停止供电措施，应当提前二十小时通知生产经营单位"}, {"key": "D", "text": "有关部门对企业采取停止供电的强制措施后，生产经营单位依法履行行政决定、采取相应措施消除事故隐患的，负有安全生产监督管理职责的部门应当及时解除停电措施"}], "answer": "D", "question": "某企业存在重大事故隐患，当地应急管理部门责令该企业停产停业整顿，该企业拒不执行，依据《安全生产法》下列说法正确的是（）。", "id": 30, "explanation": ["第七十条负有安全生产监督管理职责的部门依法对存在重大事故隐患的生产经营单位作出停产停业、停止施工、停止使用相关设施或者设备的决定，生产经营单位应当依法执行，及时消除事故隐患", "生产经营单位拒不执行，有发生生产安全事故的现实危险的，在保证安全的前提下，经本部门主要负责人批准，负有安全生产监督管理职责的部门可以采取通知有关单位停止供电、停止供应民用爆炸物品等措施，强制生产经营单位履行决定", "通知应当采用书面形式，有关单位应当予以配合", "负有安全生产监督管理职责的部门依照前款规定采取停止供电措施，除有危及生产安全的紧急情形外，应当提前二十四小时通知生产经营单位"]}, {"type": "单选", "chapter": "中华人民共和国安全生产法", "section": "第五节 安全生产的监督管理", "point": "考点八：安全生产违法行为举报的规定", "options": [{"key": "A", "text": "县级以上的应急管理部门"}, {"key": "B", "text": "县级以上人民政府"}, {"key": "C", "text": "市级以上应急管理部门"}, {"key": "D", "text": "市级以上公安机关"}], "answer": "B", "question": "依据《安全生产法》的规定，有安全生产监督管理职责的部门应当建立举报制度，其中，涉及人员死亡的举报事项应当由（）组织核查处理。", "id": 31, "explanation": ["第七十三条负有安全生产监督管理职责的部门应当建立举报制度，公开举报电话、信箱或者电子邮件地址等网络举报平台，受理有关安全生产的举报；", "受理的举报事项经调查核实后，应当形成书面材料；", "需要落实整改措施的，报经有关负责人签字并督促落实", "对不属于本部门职责，需要由其他有关部门进行调查处理的，转交其他有关部门处理"]}, {"type": "单选", "chapter": "中华人民共和国安全生产法", "section": "第五节 安全生产的监督管理", "point": "考点九：安全生产公益诉讼的规定", "options": [{"key": "A", "text": "应急管理部门"}, {"key": "B", "text": "人民法院"}, {"key": "C", "text": "人民检察院"}, {"key": "D", "text": "公民个人"}], "answer": "C", "question": "依据《安全生产法》，因安全生产违法行为造成重大事故隐患或者导致重大事故，致使国家利益或者社会公共利益受到侵害的，（）可以根据民事诉讼法、行政诉讼法的相关规定提起公益诉讼。", "id": 32, "explanation": ["第七十四条任何单位或者个人对事故隐患或者安全生产违法行为，均有权向负有安全生产监督管理职责的部门报告或者举报", "因安全生产违法行为造成重大事故隐患或者导致重大事故，致使国家利益或者社会公共利益受到侵害的，人民检察院可以根据民事诉讼法、行政诉讼法的相关规定提起公益诉讼", "或者社会公共利益受到侵害的，（）可以根据民事诉讼法、行政诉讼法的相关规定提起公益诉讼"]}, {"type": "单选", "chapter": "中华人民共和国安全生产法", "section": "第五节 安全生产的监督管理", "point": "考点十一：对存在严重违法行为的生产经营单位向社会公告的规定", "options": [{"key": "A", "text": "违法行为信息库只需如实记录生产经营单位的安全生产违法行为信息"}, {"key": "B", "text": "负有安全生产监督管理职责的部门应当对生产经营单位作出处罚决定后十个工作日内在监督管理部门公示系统予以公开曝光"}, {"key": "C", "text": "负有安全生产监督管理职责的部门应当对有关从业人员的违法行为，及时向社会公告"}, {"key": "D", "text": "有关部门和机构应当对存在失信行为的生产经营单位及其有关从业人员采取加大执法检查频次、暂停项目审批、上调有关保险费率、行业或者职业禁入等联合惩戒措施，并向社会公示"}], "answer": "D", "question": "根据《安全生产法》的规定，下列关于违法行为信息库的说法，正确的是（）。", "id": 33, "explanation": ["第七十八条负有安全生产监督管理职责的部门应当建立安全生产违法行为信息库，如实记录生产经营单位及其有关从业人员的安全生产违法行为信息；", "对违法行为情节严重的生产经营单位及其有关从业人员，应当及时向社会公告，并通报行业主管部门、投资主管部门、自然资源主管部门、生态环境主管部门、证券监督管理机构以及有关金融机构", "有关部门和机构应当对存在失信行为的生产经营单位及其有关从业人员采取加大执法检查频次、暂停项目审批、上调有关保险费率、行业或者职业禁入等联合惩戒措施，并向社会公示", "负有安全生产监督管理职责的部门应当加强对生产经营单位行政处罚信息的及时归集、共享、应用和公开，对生产经营单位作出处罚决定后七个工作日内在监督管理部门公示系统予以公开曝光，强化对违法失信生产经营单位及其有关从业人员的社会监督，提高全社会安全生产诚信水平"]}, {"type": "单选", "chapter": "中华人民共和国安全生产法", "section": "第六节 生产安全事故的应急救援与调查处理", "point": "考点四：高危生产经营单位应急救援组织及装备、器材的规定", "options": [{"key": "A", "text": "危险物品的生产、经营、储存单位都应建立应急救援组织"}, {"key": "B", "text": "生产规模较大的矿山、金属冶炼单位，可以不建立应急救援组织，但应指定兼职的应急救援人员"} 部门"}, {"key": "C", "text": "负有安全生产监督管理职责的部门接到事故报告后，应当立即按照国家有关规定上报事故情况"}, {"key": "D", "text": "有关地方人民政府和负有安全生产监督管理职责的部门的负责人接到生产安全事故报告后，应当按照生产安全事故应急救援预案的要求立即赶到事故现场，组织事故抢救"}], "answer": "A", "question": "根据《中华人民共和国安全生产法》，生产经营单位发生生产安全事故后，关于事故报告和调查的规定，说法错误的是（）。", "id": 37, "explanation": ["第八十四条负有安全生产监督管理职责的部门接到事故报告后，应当立即按照国家有关规定上报事故情况", "负有安全生产监督管理职责的部门和有关地方人民政府对事故情况不得隐瞒不报、谎报或者迟报", "《生产安全事故报告和调查处理条例》", "第三条根据生产安全事故（以下简称事故）造成的人员伤亡或者直接经济损失，事故一般分为以下等级："]}, {"type": "多选", "chapter": "中华人民共和国安全生产法", "section": "第七节 安全生产法律责任", "point": "考点四：生产经营单位的安全生产违法行为", "options": [{"key": "A", "text": "责令限期改正，逾期未改正的，处五万元以上二十万元以下的罚款"}, {"key": "B", "text": "责令限期改正，可以处十万元以下的罚款"}, {"key": "C", "text": "逾期未改正的，对直接负责的主管人员和其他直接责任人员处一万元以上两万元以下的罚款"}, {"key": "D", "text": "情节严重的，责令停产停业整顿"}, {"key": "E", "text": "相关责任人员构成犯罪的，依照刑法有关规定追究刑事责任"}], "answer": "ACDE", "question": "某生产经营单位未对安全设备进行经常性维护、保养和定期检测的。根据《安全生产法》，关于对该违法行为责任追究的说法，正确的有（）。", "id": 38, "explanation": ["1.五万元以下的罚款", "第九十九条生产经营单位有下列行为之一的，责令限期改正，处五万元以下的罚款；", "逾期未改正的，处五万元以上二十万元以下的罚款，对其直接负责的主管人员和其他直接责任人员处一万元以上二万元以下的罚款；", "情节严重的，责令停产停业整顿；"]}, {"type": "单选", "chapter": "中华人民共和国安全生产法", "section": "第七节 安全生产法律责任", "point": "考点四：生产经营单位的安全生产违法行为", "options": [{"key": "A", "text": "该劳动合同无效"}, {"key": "B", "text": "该约定经过双方同意，具有法律效力"}, {"key": "C", "text": "该约定无效"}, {"key": "D", "text": "有关部门可对该企业主要负责人处一万元以上二万元以下的罚款"}], "answer": "C", "question": "某企业与员工签订的劳动合同中部分条款约定：如果员工因作业时发生事故造成死亡的，企业支付一次性补偿金 20 万元，之后不再承担其他赔偿责任。依据《安全生产法》，下列说法正确的是（）。", "id": 39, "explanation": ["1.五万元以下的罚款", "第九十九条生产经营单位有下列行为之一的，责令限期改正，处五万元以下的罚款；", "逾期未改正的，处五万元以上二十万元以下的罚款，对其直接负责的主管人员和其他直接责任人员处一万元以上二万元以下的罚款；", "情节严重的，责令停产停业整顿；"]}, {"type": "多选", "chapter": "中华人民共和国安全生产法", "section": "第七节 安全生产法律责任", "point": "考点四：生产经营单位的安全生产违法行为", "options": [{"key": "A", "text": "责令限期改正，处十万元以下的罚款"}, {"key": "B", "text": "逾期未改正的，责令停产停业整顿，并处十万元以上二十万元以下的罚款"}, {"key": "C", "text": "逾期未改正的，提请人民政府予以关闭"}, {"key": "D", "text": "逾期未改正的，对其直接负责的主管人员和其他直接责任人员处二万元以上五万元以下的罚款"}, {"key": "E", "text": "构成犯罪的，依照刑法有关规定追究刑事责任"}], "answer": "ABDE", "question": "依据《安全生产法》，生产经营单位进行爆破、吊装作业未安排专门人员进行现场安全管理，对该生产经营单位的处罚，正确的是（）。", "id": 40, "explanation": ["1.五万元以下的罚款", "第九十九条生产经营单位有下列行为之一的，责令限期改正，处五万元以下的罚款；", "逾期未改正的，处五万元以上二十万元以下的罚款，对其直接负责的主管人员和其他直接责任人员处一万元以上二万元以下的罚款；", "情节严重的，责令停产停业整顿；"]}, {"type": "单选", "chapter": "中华人民共和国安全生产法", "section": "第七节 安全生产法律责任", "point": "考点四：生产经营单位的安全生产违法行为", "options": [{"key": "A", "text": "矿山建设项目未进行安全评价，责令停止建设或者停产停业整顿，限期改正，并处十万元以上五十万元以下的罚款"}, {"key": "B", "text": "金属冶炼建设项目没有安全设施设计，责令停止建设或者停产停业整顿，限期改正，并处十万元以上五十万元以下的罚款"}, {"key": "C", "text": "装卸危险物品的建设项目竣工投入生产或者使用前，安全设施未经验收合格的，责令停止建设或者停产停业整顿，限期改正，处五十万元以上一百万元以下的罚款"}, {"key": "D", "text": "生产、储存、装卸危险物品的建设项目的施工单位未按照批准的安全设施设计施工的，对其直接负责的主管人员和其他直接责任人员处二万元以上五万元以下的罚款"}], "answer": "C", "question": "依据《安全生产法》，对于高危行业建设活动的违法行为，下列说法错误的（）。", "id": 41, "explanation": ["1.五万元以下的罚款", "第九十九条生产经营单位有下列行为之一的，责令限期改正，处五万元以下的罚款；", "逾期未改正的，处五万元以上二十万元以下的罚款，对其直接负责的主管人员和其他直接责任人员处一万元以上二万元以下的罚款；", "情节严重的，责令停产停业整顿；"]}, {"type": "单选", "chapter": "中华人民共和国安全生产法", "section": "第七节 安全生产法律责任", "point": "考点四：生产经营单位的安全生产违法行为", "options": [{"key": "A", "text": "甲单位存在事故隐患，一年内四次受到行政处罚"}, {"key": "B", "text": "乙单位经停产停业整顿，仍不具备法律、行政法规和国家标准或者行业标准规定的安全生产条件的"}, {"key": "C", "text": "丙单位不具备法律、行政法规和国家标准或者行业标准规定的安全生产条件，导致发生了生产安全事故"}, {"key": "D", "text": "丁单位拒不执行负有安全生产监督管理职责的部门作出的行政处罚决定"}], "answer": "B", "question": "某县有甲乙丙丁四家生产经营单位。根据《安全生产法》，下列应当对生产经营单位予以关闭的是（ ）。", "id": 42, "explanation": ["1.五万元以下的罚款", "第九十九条生产经营单位有下列行为之一的，责令限期改正，处五万元以下的罚款；", "逾期未改正的，处五万元以上二十万元以下的罚款，对其直接负责的主管人员和其他直接责任人员处一万元以上二万元以下的罚款；", "情节严重的，责令停产停业整顿；"]}, {"type": "单选", "chapter": "中华人民共和国安全生产法", "section": "第七节 安全生产法律责任", "point": "考点五：从业人员的安全生产违法行为", "options": [{"key": "A", "text": "该公司总经理终身不得担任本行业生产经营单位的主要负责人"}, {"key": "B", "text": "对该公司总经理应处上一年年收入百分之四十的罚款"}, {"key": "C", "text": "若该公司总经理在事故发生后擅离职守，应对其处上一年年收入百分之二十至百分之五十的罚款"}, {"key": "D", "text": "应急管理部门可对该公司处一百万元以上二百万元以下的罚款"}], "answer": "D", "question": "某公司总经理未保证本单位安全生产投入的有效实施，导致发生事故，造成 3 人死亡，15 人重伤。根据《安全生产法》，关于该事故安全责任的说法，正确的是（ ）。", "id": 43, "explanation": ["1.对主要负责人的处罚", "第九十三条生产经营单位的决策机构、主要负责人或者个人经营的投资人不依照本法规定保证安全生产所必需的资金投入，致使生产经营单位不具备安全生产条件的，责令限期改正，提供必需的资金；", "逾期未改正的，责令生产经营单位停产停业整顿", "有前款违法行为，导致发生生产安全事故的，对生产经营单位的主要负责人给予撤职处分，对个人经营的投资人处二万元以上二十万元以下的罚款；"]}, {"type": "单选", "chapter": "中华人民共和国安全生产法", "section": "第七节 安全生产法律责任", "point": "考点五：从业人员的安全生产违法行为", "options": [{"key": "A", "text": "在检查中发现安全问题，应当及时报告本单位有关负责人和有关部门"}, {"key": "B", "text": "在检查中发现重大事故隐患，应当及时报告本单位有关负责人和有关部门"}, {"key": "C", "text": "李某未履行本法规定的安全生产管理职责，应当责令其限期改正，处二万元以上五万元以下的罚款"}, {"key": "D", "text": "李某未履行本法规定的安全生产管理职责导致发生生产安全事故的，应对其处上一年年收入百分之二十以上百分之五十以下的罚款"}], "answer": "D", "question": "李某为某单位安全生产管理人员，其有义务对本单位的安全生产状况进行经常性检查。根据《安全生产法》，下列关于李某安全检查的说法，正确的是（ ）。", "id": 44, "explanation": ["1.对主要负责人的处罚", "第九十三条生产经营单位的决策机构、主要负责人或者个人经营的投资人不依照本法规定保证安全生产所必需的资金投入，致使生产经营单位不具备安全生产条件的，责令限期改正，提供必需的资金；", "逾期未改正的，责令生产经营单位停产停业整顿", "有前款违法行为，导致发生生产安全事故的，对生产经营单位的主要负责人给予撤职处分，对个人经营的投资人处二万元以上二十万元以下的罚款；"]}, {"type": "多选", "chapter": "中华人民共和国安全生产法", "section": "第七节 安全生产法律责任", "point": "考点六：安全生产专业机构的违法行为", "options": [{"key": "A", "text": "没收 12 万元的好处费"}, {"key": "B", "text": "对评价机构处 15 万元的罚款"}, {"key": "C", "text": "对评价机构直接负责的主管人员处五万元以上十万元以下的罚款"}, {"key": "D", "text": "若给他人造成损害的，安全评价机构需与化工厂承担连带赔偿责任"}, {"key": "E", "text": "吊销其评价资质，十五年内不得从事评价工作"}], "answer": "ACD", "question": "某化工厂不具备安全生产条件，某安全评价机构在收受化工厂 12 万元的好处费后，为化工厂出具了符合要求的虚假安全评价报告。依据《安全生产法》的规定，下列关于安全评价机构应当承担的法律责任，说法正确的是（）。", "id": 45, "explanation": ["第九十二条承担安全评价、认证、检测、检验职责的机构出具失实报告的，责令停业整顿，并处三万元以上十万元以下的罚款；", "承担安全评价、认证、检测、检验职责的机构租借资质、挂靠、出具虚假报告的，没收违法所得；", "违法所得在十万元以上的，并处违法所得二倍以上五倍以下的罚款，没有违法所得或者违法所得不足十万元的，单处或者并处十万元以上二十万元以下的罚款；", "对其直接负责的主管人员和其他直接责任人员处五万元以上十万元以下的罚款；"]}, {"type": "单选", "chapter": "安全生产单行法律", "section": "第一节 中华人民共和国矿山安全法", "point": "考点二：矿山建设的安全保障的规定", "options": [{"key": "A", "text": "矿山设计中的防瓦斯系统和防尘系统必须符合矿山安全规程和行业技术规范"}, {"key": "B", "text": "每个矿井必须有三个以上能行人的安全出口"}, {"key": "C", "text": "矿山必须有与外界相通的、符合安全要求的运输和通讯设施"}, {"key": "D", "text": "矿山企业对矿山闭坑后可能引起的危害，应当采取预防措施"}], "answer": "B", "question": "根据《中华人民共和国矿山安全法》，关于矿山建设的安全保障的规定，说法错误的是（ ）。", "id": 46, "explanation": ["第七条矿山建设工程的安全设施必须和主体工程同时设计、同时施工、同时投入生产和使用", "2.矿山建设工程安全设施的设计和竣工验收", "第八条矿山建设工程的设计文件，必须符合矿山安全规程和行业技术规范，并按照国家规定经管理矿山企业的主管部门批准；", "不符合矿山安全规程和行业技术规范的，不得批准"]}, {"type": "单选", "chapter": "安全生产单行法律", "section": "第一节 中华人民共和国矿山安全法", "point": "考点三：矿山开采的安全保障的规定", "options": [{"key": "A", "text": "矿山设计保留的矿柱、岩柱，经管理矿山企业的主管部门批准后，可以开采"}, {"key": "B", "text": "矿山企业必须对井下有毒有害物质、井下空气含氧量、可燃性气体浓度进行检测"}, {"key": "C", "text": "矿山使用的设备、器材、防护用品和安全检测仪器，不符合行业标准的，必须经过有关部门的批准"}, {"key": "D", "text": "矿山企业必须对机电设备及其防护装置、安全检测仪器，定期检查、维修，保证使用安全"}], "answer": "D", "question": "依据《矿山安全法》的规定，下列关于矿山安全保障的说法，正确的是（ ）。", "id": 47, "explanation": ["第十三条矿山开采必须具备保障安全生产的条件，执行开采不同矿种的矿山安全规程和行业技术规范", "第十四条矿山设计规定保留的矿柱、岩柱，在规定的期限内，应当予以保护，不得开采或者毁坏", "第十五条矿山使用的有特殊安全要求的设备、器材、防护用品和安全检测仪器，必须符合国家安全标准或者行业安全标准；", "不符合国家安全标准或者行业安全标准的，不得使用"]}, {"type": "单选", "chapter": "安全生产单行法律", "section": "第一节 中华人民共和国矿山安全法", "point": "考点四：矿山企业的安全管理的规定", "options": [{"key": "A", "text": "矿山企业必须建立、健全安全生产责任制，矿长对本企业的安全生产工作负责"}, {"key": "B", "text": "矿长应当定期向职工代表大会或者职工大会报告安全生产工作，发挥职工代表大会的监督作用"}, {"key": "C", "text": "矿山企业职工有权对危害安全的行为，提出批评、检举和控告"}, {"key": "D", "text": "矿山企业工会依法维护职工生产安全的合法权益，对矿山安全工作进行管理监督"}], "answer": "D", "question": "根据《矿山安全法》的规定，下列关于矿山企业的安全管理，说法错误的是（ ）。", "id": 48, "explanation": ["第二十条矿山企业必须建立、健全安全生产责任制", "矿长对本企业的安全生产工作负责", "第二十一条矿长应当定期向职工代表大会或者职工大会报告安全生产工作，发挥职工代表大会的监督作用", "第二十四条矿山企业违反有关安全的法律、法规，工会有权要求企业行政方面或者有关部门认真处理"]}, {"type": "单选", "chapter": "安全生产单行法律", "section": "第二节 中华人民共和国消防法", "point": "考点一：火灾预防的规定", "options": [{"key": "A", "text": "所有的建设工程均需要有消防设计，并且报送住房与城乡建设主管部门进行审查"}, {"key": "B", "text": "国务院住房和城乡建设主管部门规定的特殊建设工程，建设单位应当将消防设计文件报送消防救援机构进行审查，消防救援机构依法对审查的结果负责"}, {"key": "C", "text": "依法应当由住房与城乡建设主管部门进行消防验收的建设工程，未经消防验收或者依法抽查不合格的，应当停止使用"}, {"key": "D", "text": "人员密集场所室内装修、装饰，应当按照消防技术标准的要求，使用不燃、难燃材料"}], "answer": "D", "question": "根据《消防法》的有关规定，下列关于火灾预防的说法正确的是（ ）。", "id": 49, "explanation": ["第八条地方各级人民政府应当将包括消防安全布局、消防站、消防供水、消防通信、消防车通道、消防装备等内容的消防规划纳入城乡规划，并负责组织实施", "城乡消防安全布局不符合消防安全要求的，应当调整、完善；", "公共消防设施、消防装备不足或者不适应实际需要的，应当增建、改建、配置或者进行技术改造", "第二十二条生产、储存、装卸易燃易爆危险品的工厂、仓库和专用车站、码头的设置，应当符合消防技术标准"]}, {"type": "单选", "chapter": "安全生产单行法律", "section": "第二节 中华人民共和国消防法", "point": "考点一：火灾预防的规定", "options": [{"key": "A", "text": "该商场应当向场所所在地的县级以上住房和城乡建设主管部门申请消防安全检查"}, {"key": "B", "text": "该商场若不采用告知承诺的方式办理消防安全检查，住房和城乡建设部门应当自受理申请之日起十个工作日内对商场进行检查"}, {"key": "C", "text": "未经消防救援机构许可的，不得投入使用、营业"}, {"key": "D", "text": "该商场若采用告知承诺的方式办理消防安全检查，应急管理部门应当自受理申请之日起十个工作日内对商场进行检查"}], "answer": "C", "question": "某大型商场建设完成，准备正式投入使用、营业。根据《消防法》，下列说法正确的是（ ）。", "id": 50, "explanation": ["第八条地方各级人民政府应当将包括消防安全布局、消防站、消防供水、消防通信、消防车通道、消防装备等内容的消防规划纳入城乡规划，并负责组织实施", "城乡消防安全布局不符合消防安全要求的，应当调整、完善；", "公共消防设施、消防装备不足或者不适应实际需要的，应当增建、改建、配置或者进行技术改造", "第二十二条生产、储存、装卸易燃易爆危险品的工厂、仓库和专用车站、码头的设置，应当符合消防技术标准"]}, {"type": "单选", "chapter": "安全生产单行法律", "section": "第二节 中华人民共和国消防法", "point": "考点一：火灾预防的规定", "options": [{"key": "A", "text": "确定消防安全管理人，组织实施本单位的消防安全管理工作"}, {"key": "B", "text": "建立消防档案，确定消防安全重点部位，设置防火标志，实行严格管理"}, {"key": "C", "text": "实行每周防火巡查，并建立巡查记录"}, {"key": "D", "text": "对职工进行岗前消防安全培训，定期组织消防安全培训和消防演练"}], "answer": "C", "question": "依据《消防法》的规定，下列关于消防安全重点单位的消防安全职责的说法，错误的是（ ）。", "id": 51, "explanation": ["第八条地方各级人民政府应当将包括消防安全布局、消防站、消防供水、消防通信、消防车通道、消防装备等内容的消防规划纳入城乡规划，并负责组织实施", "城乡消防安全布局不符合消防安全要求的，应当调整、完善；", "公共消防设施、消防装备不足或者不适应实际需要的，应当增建、改建、配置或者进行技术改造", "第二十二条生产、储存、装卸易燃易爆危险品的工厂、仓库和专用车站、码头的设置，应当符合消防技术标准"]}, {"type": "单选", "chapter": "安全生产单行法律", "section": "第二节 中华人民共和国消防法", "point": "考点二：消防组织的规定", "options": [{"key": "A", "text": "生产黑火药的大型企业"}, {"key": "B", "text": "小型民用机场"}, {"key": "C", "text": "储存黑火药的大型仓库"}, {"key": "D", "text": "火力发电厂"}], "answer": "D", "question": "为了预防和减少火灾危害，加强应急救援工作，维护公共安全，依据《消防法》的规定，下列单位中不用建立专职消防队的是（ ）。", "id": 52, "explanation": ["第三十六条县级以上地方人民政府应当按照国家规定建立国家综合性消防救援队、专职消防队，并按照国家标准配备消防装备，承担火灾扑救工作", "乡镇人民政府应当根据当地经济发展和消防工作的需要，建立专职消防队、志愿消防队，承担火灾扑救工作", "第三十七条国家综合性消防救援队、专职消防队按照国家规定承担重大灾害事故和其他以抢救人员生命为主的应急救援工作", "第三十九条下列单位应当建立单位专职消防队，承担本单位的火灾扑救工作："]}, {"type": "单选", "chapter": "安全生产单行法律", "section": "第二节 中华人民共和国消防法", "point": "考点三：灭火救援的规定", "options": [{"key": "A", "text": "任何单位都应当无偿为报警提供便利，不得阻拦报警"}, {"key": "B", "text": "人员密集场所发生火灾，现场工作人员应当立即组织、引导在场人员疏散"}, {"key": "C", "text": "应急管理部门有权实行交通管制，进行局部断水断电"}, {"key": "D", "text": "任何单位发生火灾，必须立即组织力量扑救，邻近单位应当给予支援"}], "answer": "C", "question": "依据《消防法》，下列关于灭火救援的说法错误的是（ ）。", "id": 53, "explanation": ["第四十三条县级以上地方人民政府应当组织有关部门针对本行政区域内的火灾特点制定应急预案，建立应急反应和处置机制，为火灾扑救和应急救援工作提供人员、装备等保障", "第四十四条任何人发现火灾都应当立即报警", "任何单位、个人都应当无偿为报警提供便利，不得阻拦报警", "人员密集场所发生火灾，该场所的现场工作人员应当立即组织、引导在场人员疏散"]}, {"type": "单选", "chapter": "安全生产单行法律", "section": "第二节 中华人民共和国消防法", "point": "考点三：灭火救援的规定", "options": [{"key": "A", "text": "专职消防队参加火灾以外的其他重大灾害事故的应急救援工作，由设区的市级以上人民政府统一领导"}, {"key": "B", "text": "设区的市级以上地方人民政府应当组织有关部门针对本行政区域内的火灾特点制定应急预案"}, {"key": "C", "text": "消防车前往执行应急救援任务时，不受行驶速度、行驶路线的限制，但不得逆向行驶"}, {"key": "D", "text": "火灾现场总指挥根据扑救火灾的需要，有权决定使用各种水源"}], "answer": "D", "question": "根据《消防法》，关于灭火救援的说法，正确的是（ ）。", "id": 54, "explanation": ["第四十三条县级以上地方人民政府应当组织有关部门针对本行政区域内的火灾特点制定应急预案，建立应急反应和处置机制，为火灾扑救和应急救援工作提供人员、装备等保障", "第四十四条任何人发现火灾都应当立即报警", "任何单位、个人都应当无偿为报警提供便利，不得阻拦报警", "人员密集场所发生火灾，该场所的现场工作人员应当立即组织、引导在场人员疏散"]}, {"type": "单选", "chapter": "安全生产单行法律", "section": "第三节 中华人民共和国道路交通安全法", "point": "考点一：道路交通事故处理的规定", "options": [{"key": "A", "text": "机动车之间发生交通事故的，由有过错的一方承担赔偿责任"}, {"key": "B", "text": "机动车与行人之间发生交通事故，行人没有过错的，由机动车一方承担赔偿责任"}, {"key": "C", "text": "机动车与行人之间发生交通事故，机动车一方没有过错的，可免除机动车一方的责任"}, {"key": "D", "text": "交通事故的损失是由行人故意碰撞机动车造成的，机动车一方不承担赔偿责任"}], "answer": "C", "question": "根据《道路交通安全法》，机动车发生交通事故造成人身伤亡、财产损失的，由保险公司在机动车第三者责任强制保险责任限额范围内予以赔偿；对于不足的部分，下列说法错误的是（ ）。", "id": 55, "explanation": ["1.交通事故现场处理", "第七十条在道路上发生交通事故，车辆驾驶人应当立即停车，保护现场；", "造成人身伤亡的，车辆驾驶人应当立即抢救受伤人员，并迅速报告执勤的交通警察或者公安机关交通管理部门", "因抢救受伤人员变动现场的，应当标明位置"]}, {"type": "单选", "chapter": "安全生产单行法律", "section": "第三节 中华人民共和国道路交通安全法", "point": "考点二：道路通行的规定", "options": [{"key": "A", "text": "全挂拖斗车进入高速公路时，最低时速不得低于七十公里"}, {"key": "B", "text": "高速公路限速标志标明的最高时速不得超过一百二十公里"}, {"key": "C", "text": "机动车在高速公路上发生故障时，应当在故障车来车方向一百米以外设置警告标志"}, {"key": "D", "text": "任何单位、个人不得在高速公路上拦截检查行驶的车辆，人民法院人员依法执行紧急公务除外"}], "answer": "B", "question": "高速公路作为我国道路体系的重要组成部分，因其特殊性在行驶速度和允许上路车型上有特殊要求。根据《道路交通安全法》，下列关于高速公路安全管理的说法，正确的是（ ）。", "id": 56, "explanation": ["第四十三条同车道行驶的机动车，后车应当与前车保持足以采取紧急制动措施的安全距离", "有下列情形之一的，不得超车：", "第四十四条机动车通过交叉路口，应当按照交通信号灯、交通标志、交通标线或者交通警察的指挥通过；", "通过没有交通信号灯、交通标志、交通标线或者交通警察指挥的交叉路口时，应当减速慢行，并让行人和优先通行的车辆先行"]}, {"type": "单选", "chapter": "安全生产单行法律", "section": "第三节 中华人民共和国道路交通安全法", "point": "考点二：道路通行的规定", "options": [{"key": "A", "text": "因工程建设需要占用道路的，应当事先征得公安机关交通管理部门同意"}, {"key": "B", "text": "挖掘道路施工作业完毕，清除道路上的障碍物后方可恢复通行"}, {"key": "C", "text": "未经许可，任何单位和个人不得占用道路从事非交通活动"}, {"key": "D", "text": "道路出现坍塌，公安机关交通管理部门应当及时修复"}], "answer": "C", "question": "根据《道路交通安全法》，下列关于道路通行条件的说法，正确的有（ ）。", "id": 57, "explanation": ["第四十三条同车道行驶的机动车，后车应当与前车保持足以采取紧急制动措施的安全距离", "有下列情形之一的，不得超车：", "第四十四条机动车通过交叉路口，应当按照交通信号灯、交通标志、交通标线或者交通警察的指挥通过；", "通过没有交通信号灯、交通标志、交通标线或者交通警察指挥的交叉路口时，应当减速慢行，并让行人和优先通行的车辆先行"]}, {"type": "单选", "chapter": "安全生产单行法律", "section": "第三节 中华人民共和国道路交通安全法", "point": "考点四：道路交通安全违法行为应负的法律责任", "options": [{"key": "A", "text": "公安机关交通管理部门约束至酒醒，吊销机动车驾驶证"}, {"key": "B", "text": "公安机关交通管理部门吊销机动车驾驶证，终身不得取得机动车驾驶证"}, {"key": "C", "text": "处十五日拘留，并处五千元罚款"}, {"key": "D", "text": "处十日以下拘留，并处一千元以上二千元以下罚款"}], "answer": "A", "question": "陈某参加聚会醉酒后，为了自身安全选择从车辆较少的郊区绕路开车回家。根据《道路交通安全法》的规定，下列对于陈某的处罚符合规定的是（ ）。", "id": 58, "explanation": ["第九十一条饮酒后驾驶机动车的，处暂扣六个月机动车驾驶证，并处一千元以上二千元以下罚款", "因饮酒后驾驶机动车被处罚，再次饮酒后驾驶机动车的，处十日以下拘留，并处一千元以上二千元以下罚款，吊销机动车驾驶证", "醉酒驾驶机动车的，由公安机关交通管理部门约束至酒醒，吊销机动车驾驶证，依法追究刑事责任；", "五年内不得重新取得机动车驾驶证"]}, {"type": "单选", "chapter": "安全生产单行法律", "section": "第四节 中华人民共和国特种设备安全法", "point": "考点一：一般规定", "options": [{"key": "A", "text": "特种设备生产单位及其主要负责人对其生产的特种设备安全负责"}, {"key": "B", "text": "特种设备使用单位应当按照国家有关规定配备特种设备安全管理人员、检测人员和作业人员"}, {"key": "C", "text": "特种设备检测人员和作业人员应当按照国家有关规定取得相应资格，方可从事相关工作"}, {"key": "D", "text": "特种设备安全管理人员经企业 : "特种设备安装、改造、修理的施工单位应当在施工前将拟进行的特种设备安装、改造、修理情况书面告知直辖市或者设区的市级人民政府负责特种设备安全监督管理的部门"}, {"key": "D", "text": "特种设备安装、改造、修理竣工后，安装、改造、修理的施工单位应当在验收后三十日内将相关技术资料和文件移交特种设备使用单位"}, {"key": "E", "text": "特种设备的制造过程应当经特种设备检验机构按照安全技术规范的要求进行监督检验，未经监督检验或者监督检验不合格的，不得出厂或者交付使用"}], "answer": "ACD", "question": "依据《特种设备安全法》，下列关于特种设备的生产、安装、改造、修理的要求，说法正确的是（ ）。", "id": 62, "explanation": ["1.生产许可与生产单位义务", "第十六条特种设备采用新材料、新技术、新工艺，与安全技术规范的要求不一致，或者安全技术规范未作要求、可能对安全性能有重大影响的，应当向国务院负责特种设备安全监督管理的部门申报，由国务院负责特种设备安全监督管理的部门及时委托安全技术咨询机构或者相关专业机构进行技术评审，评审结果经国务院负责特种设备安全监督管理的部门批准，方可投入生产、使用", "国务院负责特种设备安全监督管理的部门应当将允许使用的新材料、新技术、新工艺的有关技术要求，及时纳入安全技术规范", "第十八条国家按照分类监督管理的原则对特种设备生产实行许可制度"]}, {"type": "单选", "chapter": "安全生产单行法律", "section": "第四节 中华人民共和国特种设备安全法", "point": "考点三：特种设备的经营", "options": [{"key": "A", "text": "禁止销售未取得许可生产的特种设备，未经检验和检验不合格的特种设备，或者国家明令淘汰和已经报废的特种设备"}, {"key": "B", "text": "进口特种设备的安装及使用维护保养说明、产品铭牌、安全警示标志及其说明应当采用中文"}, {"key": "C", "text": "进口特种设备，应当向进口地负责特种设备安全监督管理的部门履行提前告知义务"}, {"key": "D", "text": "特种设备在出租期间的使用管理和维护保养义务由承租单位承担，当事人另有约定的除外"}], "answer": "D", "question": "依据《特种设备安全法》，下列关于特种设备销售、出租、进口的说法，错误的是（ ）。", "id": 63, "explanation": ["第二十七条特种设备销售单位销售的特种设备，应当符合安全技术规范及相关标准的要求，其设计文件、产品质量合格证明、安装及使用维护保养说明、监督检验证明等相关技术资料和文件应当齐全", "特种设备销售单位应当建立特种设备检查验收和销售记录制度", "禁止销售未取得许可生产的特种设备，未经检验和检验不合格的特种设备，或者国家明令淘汰和已经报废的特种设备", "第二十八条特种设备出租单位不得出租未取得许可生产的特种设备或者国家明令淘汰和已经报废的特种设备，以及未按照安全技术规范的要求进行维护保养和未经检验或者检验不合格的特种设备"]}, {"type": "单选", "chapter": "安全生产单行法律", "section": "第四节 中华人民共和国特种设备安全法", "point": "考点四：特种设备的使用", "options": [{"key": "A", "text": "甲公司应当建立电梯检查验收和销售记录制度"}, {"key": "B", "text": "乙公司应当对该电梯进行维护保养"}, {"key": "C", "text": "乙公司应当在电梯投入使用后 60 日内向有关部门办理使用登记"}, {"key": "D", "text": "乙公司应当在检验合格有效期届满前 60 日向特种设备检验机构提出定期检验要求"}], "answer": "A", "question": "甲公司将其制造的电梯销售给乙公司使用。根据《特种设备安全法》及相关规定，关于电梯经营和使用的说法，正确的有（ ）", "id": 64, "explanation": ["第三十二条特种设备使用单位应当使用取得许可生产并经检验合格的特种设备", "第三十三条特种设备使用单位应当在特种设备投入使用前或者投入使用后三十日内，向负责特种设备安全监督管理的部门办理使用登记，取得使用登记证书", "登记标志应当置于该特种设备的显著位置", "第三十四条特种设备使用单位应当建立岗位责任、隐患治理、应急救援等安全管理制度，制定操作规程，保证特种设备安全运行"]}, {"type": "单选", "chapter": "安全生产单行法律", "section": "第四节 中华人民共和国特种设备安全法", "point": "考点四：特种设备的使用", "options": [{"key": "A", "text": "电梯、客运索道、大型游乐设施等为公众提供服务的特种设备的运营使用单位，应当设置特种设备安全管理机构"}, {"key": "B", "text": "特种设备使用单位应当按照安全技术规范的要求，在检验合格有效期届满前 90 天向特种设备检验机构提出定期检验要求"}, {"key": "C", "text": "特种设备属于共有的，不得委托他人管理特种设备"}, {"key": "D", "text": "客运索道、大型游乐设施在每日投入使用前，其运营使用单位应当进行试运行和例行安全检查，并对安全附件和安全保护装置进行检查确认"}], "answer": "D", "question": "依据《特种设备安全法》，下列特种设备使用过程中的相关说法，正确的是（ ）。", "id": 65, "explanation": ["第三十二条特种设备使用单位应当使用取得许可生产并经检验合格的特种设备", "第三十三条特种设备使用单位应当在特种设备投入使用前或者投入使用后三十日内，向负责特种设备安全监督管理的部门办理使用登记，取得使用登记证书", "登记标志应当置于该特种设备的显著位置", "第三十四条特种设备使用单位应当建立岗位责任、隐患治理、应急救援等安全管理制度，制定操作规程，保证特种设备安全运行"]}, {"type": "单选", "chapter": "安全生产单行法律", "section": "第四节 中华人民共和国特种设备安全法", "point": "考点五：特种设备的检验和检测", "options": [{"key": "A", "text": "特种设备检验检测机构和检验检测人员对涉及的被检验检测单位的商业秘密，负有保密义务"}, {"key": "B", "text": "特种设备检验检测机构和检验检测人员对检验检测结果、鉴定结论负责"}, {"key": "C", "text": "特种设备检验检测机构和检验检测人员可从事特种设备的生产、销售"}, {"key": "D", "text": "特种设备检验检测人员不得同时在两个以上检验检测机构中执业"}], "answer": "C", "question": "根据《特种设备安全法》，关于特种设备检验检测人员的要求，说法错误的是（ ）。", "id": 66, "explanation": ["第五十一条特种设备检验、检测机构的检验、检测人员应当经考核，取得检验、检测人员资格，方可从事检验、检测工作", "特种设备检验、检测机构的检验、检测人员不得同时在两个以上检验、检测机构中执业；", "变更执业机构的，应当依法办理变更手续", "第五十三条特种设备检验、检测机构及其检验、检测人员应当客观、公正、及时地出具检验、检测报告，并对检验、检测结果和鉴定结论负责"]}, {"type": "单选", "chapter": "安全生产单行法律", "section": "第五节 中华人民共和国建筑法", "point": "考点二：建筑许可", "options": [{"key": "A", "text": "建筑工程开工前，建设单位应当向工程所在地设区的市级以上人民政府建设行政主管部门申请领取施工许可证"}, {"key": "B", "text": "国务院建设行政主管部门确定的限额以下的小型工程开工前，建设单位应当申请领取施工许可证"}, {"key": "C", "text": "按照国务院规定的权限和程序批准开工报告的建筑工程，不再领取施工许可证"}, {"key": "D", "text": "按照国务院规定的权限和程序批准开工报告的建筑工程，需要领取施工许可证"}], "answer": "C", "question": "根据《中华人民共和国建筑法》，关于建筑工程施工许可的规定,说法正确的是（ ）。", "id": 67, "explanation": ["1.建设单位的建筑许可及要求", "第七条建筑工程开工前，建设单位应当按照国家有关规定向工程所在地县级以上人民政府建设行政主管部门申请领取施工许可证；", "但是，国务院建设行政主管部门确定的限额以下的小型工程除外", "按照国务院规定的权限和程序批准开工报告的建筑工程，不再领取施工许可证"]}, {"type": "单选", "chapter": "安全生产单行法律", "section": "第五节 中华人民共和国建筑法", "point": "考点二：建筑许可", "options": [{"key": "A", "text": "有满足施工需要的资金安排、施工图纸及技术资料"}, {"key": "B", "text": "已经确定监理单位"}, {"key": "C", "text": "有保证工程质量和安全的具体措施"}, {"key": "D", "text": "需要拆迁的，其拆迁进度符合施工要求"}], "answer": "B", "question": "根据《中华人民共和国建筑法》，申请领取施工许可证，应当具备的条件不包括（ ）。", "id": 68, "explanation": ["1.建设单位的建筑许可及要求", "第七条建筑工程开工前，建设单位应当按照国家有关规定向工程所在地县级以上人民政府建设行政主管部门申请领取施工许可证；", "但是，国务院建设行政主管部门确定的限额以下的小型工程除外", "按照国务院规定的权限和程序批准开工报告的建筑工程，不再领取施工许可证"]}, {"type": "单选", "chapter": "安全生产单行法律", "section": "第五节 中华人民共和国建筑法", "point": "考点二：建筑许可", "options": [{"key": "A", "text": "建设单位应当自领取施工许可证之日起 1 个月内开工"}, {"key": "B", "text": "建设单位领取施工许可证时，应当有保证质量和安全的具体措施"}, {"key": "C", "text": "中止施工满 3 年的工程恢复施工前，建设单位应当报发证机关核验施工许可证"}, {"key": "D", "text": "建筑工程开工前，建设单位应当按照国家有关规定向工程所在地市级以上人民政府建设主管部门申请施工许可证"}], "answer": "B", "question": "根据《建筑法》，关于施工许可的说法，正确的是（ ）。", "id": 69, "explanation": ["1.建设单位的建筑许可及要求", "第七条建筑工程开工前，建设单位应当按照国家有关规定向工程所在地县级以上人民政府建设行政主管部门申请领取施工许可证；", "但是，国务院建设行政主管部门确定的限额以下的小型工程除外", "按照国务院规定的权限和程序批准开工报告的建筑工程，不再领取施工许可证"]}, {"type": "多选", "chapter": "安全生产单行法律", "section": "第五节 中华人民共和国建筑法", "point": "考点三：建筑工程发包与承包", "options": [{"key": "A", "text": "承包单位可以将其承包的全部建筑工程转包给他人"}, {"key": "B", "text": "实行施工总承包的，建筑工程主体结构的施工必须由总承包单位自行完成"}, {"key": "C", "text": "建筑工程的发包单位可以将建筑工程的勘察、设计、施工、设备采购一并发包给一个工程总承包单位"}, {"key": "D", "text": "分包单位可以将其承包的工程再分包"}, {"key": "E", "text": "两个以上不同资质等级的单位实行联合共同承包的，应当按照资质等级低的单位的业务许可范围承揽工程"}], "answer": "BCE", "question": "根据《建筑法》,下列关于建筑工程的发包、承包说法正确的是（ ）。", "id": 70, "explanation": ["第十五条建筑工程的发包单位与承包单位应当依法订立书面合同，明确双方的权利和义务", "发包单位和承包单位应当全面履行合同约定的义务", "建筑工程的发包单位可以将建筑工程的勘察、设计、施工、设备采购一并发包给一个工程总承包单位，也可以将建筑工程勘察、设计、施工、设备采购的一项或者多项发包给一个工程总承包单位；", "但是，不得将应当由一个承包单位完成的建筑工程肢解成若干部分发包给几个承包单位"]}, {"type": "单选", "chapter": "安全生产单行法律", "section": "第五节 中华人民共和国建筑法", "point": "考点四：建筑工程的监理", "options": [{"key": "A", "text": "工程监理单位与被监理工程的设备供应单位不得有隶属关系"}, {"key": "B", "text": "工程监理单位不得转让工程监理业务"}, {"key": "C", "text": "工程监理单位对应当监督检查的项目不检查或者不按照规定检查，给建设单位造成损失的，应当与承包单位承担连带赔偿责任"}, {"key": "D", "text": "工程监理单位与承包单位串通，为承包单位谋取非法利益，给建设单位造成损失的，应当与承包单位承担连带赔偿责任"}], "answer": "C", "question": "根据《中华人民共和国建筑法》，关于工程监理的规定，说法错误的是（ ）。", "id": 71, "explanation": ["第三十二条建筑工程监理应当依照法律、行政法规及有关的技术标准、设计文件和建筑工程承包合同，对承包单位在施工质量、建设工期和建设资金使用等方面，代表建设单位实施监督", "工程监理人员发现工程设计不符合建筑工程质量标准或者合同约定的质量要求的，应当报告建设单位要求设计单位改正", "第三十四条工程监理单位应当在其资质等级许可的监理范围内，承担工程监理业务", "工程监理单位应当根据建设单位的委托，客观、公正地执行监理任务"]}, {"type": "单选", "chapter": "安全生产单行法律", "section": "第五节 中华人民共和国建筑法", "point": "考点五：建筑安全生产管理", "options": [{"key": "A", "text": "施工现场安全由建筑施工企业负责"}, {"key": "B", "text": "实行施工总承包的，施工现场安全由总承包单位负责"}, {"key": "C", "text": "分包单位向建设单位负责，服从建设单位对施工现场的安全生产管理"}, {"key": "D", "text": "建筑施工企业的法定代表人对本企业的安全生产负责"}], "answer": "C", "question": "根据《中华人民共和国建筑法》，关于建筑施工企业安全生产管理的规定,说法错误的是（ ）。", "id": 72, "explanation": ["第三十六条建筑工程安全生产管理必须坚持安全第一、预防为主的方针，建立健全安全生产的责任制度和群防群治制度", "第四十条建设单位应当向建筑施工企业提供与施工现场相关的地下管线资料，建筑施工企业应当采取措施加以保护", "第四十二条有下列情形之一的，建设单位应当按照国家有关规定办理申请批准手续：", "第四十九条涉及建筑主体和承重结构变动的装修工程，建设单位应当在施工前委托原设计单位或者具有相应资质条件的设计单位提出设计方案；"]}, {"type": "单选", "chapter": "安全生产单行法律", "section": "第五节 中华人民共和国建筑法", "point": "考点六：建筑工程质量管理", "options": [{"key": "A", "text": "建筑施工企业对工程的施工质量负责"}, {"key": "B", "text": "建筑工程实行总承包的，工程质量由工程总承包单位负责"}, {"key": "C", "text": "总承包单位将建筑工程分包给其他单位的，分包工程的质量由分包单位单独负责，总包单位无需负责"}, {"key": "D", "text": "建筑施工企业不得擅自修改工程设计"}], "answer": "C", "question": "根据《中华人民共和国建筑法》，关于建筑工程质量管理的说法错误的是（ ）。", "id": 73, "explanation": ["第五十四条建设单位不得以任何理由，要求建筑设计单位或者建筑施工企业在工程设计或者施工作业中，违反法律、行政法规和建筑工程质量、安全标准，降低工程质量", "建筑设计单位和建筑施工企业对建设单位违反前款规定提出的降低工程质量的要求，应当予以拒绝", "第五十五条建筑工程实行总承包的，工程质量由工程总承包单位负责，总承包单位将建筑工程分包给其他单位的，应当对分包工程的质量与分包单位承担连带责任", "分包单位应当接受总承包单位的质量管理"]}, {"type": "单选", "chapter": "安全生产相关法律", "section": "第一节 民法典", "point": "考点一：民事主体制度", "options": [{"key": "A", "text": "自然人的民事权利能力是自然人具有的能够以自己名义作为民事法律关系主体的资格"}, {"key": "B", "text": "自然人的民事权利能力一律平等"}, {"key": "C", "text": "自然人从成年时起到死亡时止，具有民事权利能力，依法享有民事权利，承担民事义务"}, {"key": "D", "text": "十八周岁以上的自然人为成年人"}], "answer": "C", "question": "依据《民法典》，下列关于民事权利能力的说法，错误的是（ ）。", "id": 74, "explanation": ["第十八条成年人为完全民事行为能力人，可以独立实施民事法律行为", "十六周岁以上的未成年人，以自己的劳动收入为主要生活来源的，视为完全民事行为能力人", "第十九条八周岁以上的未成年人为限制民事行为能力人，实施民事法律行为由其法定代理人代理或者经其法定代理人同意、追认；", "但是，可以独立实施纯获利益的民事法律行为或者与其年龄、智力相适应的民事法律行为"]}, {"type": "单选", "chapter": "安全生产相关法律", "section": "第一节 民法典", "point": "考点一：民事主体制度", "options": [{"key": "A", "text": "法人分为营利法人、非营利法人、特别法人"}, {"key": "B", "text": "营利法人进一步分为有限责任公司、股份有限公司和事业单位法人"}, {"key": "C", "text": "非营利法人进一步分为事业单位法人、社会团体法人、社会服务机构法人等"}, {"key": "D", "text": "特别法人进一步分为机关法人、农村集体经济组织法人、城镇农村的合作经济组织法人、基层群众性自治组织法人"}], "answer": "B", "question": "依据《民法典》，下列关于法人的分类的说法，错误的是（ ）。", "id": 75, "explanation": ["第十八条成年人为完全民事行为能力人，可以独立实施民事法律行为", "十六周岁以上的未成年人，以自己的劳动收入为主要生活来源的，视为完全民事行为能力人", "第十九条八周岁以上的未成年人为限制民事行为能力人，实施民事法律行为由其法定代理人代理或者经其法定代理人同意、追认；", "但是，可以独立实施纯获利益的民事法律行为或者与其年龄、智力相适应的民事法律行为"]}, {"type": "多选", "chapter": "安全生产相关法律", "section": "第一节 民法典", "point": "考点三：民事责任", "options": [{"key": "A", "text": "没收财产"}, {"key": "B", "text": "停止侵害"}, {"key": "C", "text": "罚金"}, {"key": "D", "text": "恢复原状"}, {"key": "E", "text": "赔礼道歉"}], "answer": "BDE", "question": "根据《民法典》,民事责任的承担方式包括（ ）。", "id": 76, "explanation": ["本条规定的承担民事责任的方式，可以单独适用，也可以合并适用", "第一百七十七条二人以上依法承担按份责任，能够确定责任大小的，各自承担相应的责任；", "第一百七十八条二人以上依法承担连带责任的，权利人有权请求部分或者全部连带责任人承担责任", "连带责任，由法律规定或者当事人约定"]}, {"type": "单选", "chapter": "安全生产相关法律", "section": "第一节 民法典", "point": "考点五：与安全生产有关的规定", "options": [{"key": "A", "text": "小王"}, {"key": "B", "text": "小王所在工作的施工企业"}, {"key": "C", "text": "与小王签订劳动合同的劳务派遣单位"}, {"key": "D", "text": "小王和施工企业承担连带责任"}], "answer": "B", "question": "小王接受单位派遣到某建筑施工企业工作，在工作期间，因执行工作任务造成他人损害的由（ ）承担侵权责任。", "id": 77, "explanation": ["（一）用人者责任第一千一百九十一条用人单位的工作人员因执行工作任务造成他人损害的，由用人单位承担侵权责任", "用人单位承担侵权责任后，可以向有故意或者重大过失的工作人员追偿", "劳务派遣期间，被派遣的工作人员因执行工作任务造成他人损害的，由接受劳务派遣的用工单位承担侵权责任；", "第一千一百九十二条个人之间形成劳务关系，提供劳务一方因劳务造成他人损害的，由接受劳务一方承担侵权责任"]}, {"type": "单选", "chapter": "安全生产相关法律", "section": "第一节 民法典", "point": "考点五：与安全生产有关的规定", "options": [{"key": "A", "text": "从建筑物中抛掷物品或者从建筑物上坠落的物品造成他人损害的，由侵权人依法承担侵权责任"}, {"key": "B", "text": "占有或者使用易燃、易爆、剧毒、高放射性、强腐蚀性、高致病性等高度危险物造成他人损害的，占有人或者使用人应当承担侵权责任"}, {"key": "C", "text": "宾馆、商场、银行、车站、机场、体育场馆、娱乐场所等经营场所、公共场所的经营者、管理者或者群众性活动的组织者，未尽到安全保障义务，造成他人损害的，应当承担侵权责任"}, {"key": "D", "text": "占有或者使用易燃、易爆、剧毒、高放射性、强腐蚀性、高致病性等高度危险物造成他人损害的，但是，能够证明被侵权人对损害的发生有重大过失的，占有人或者使用人不承担责任"}], "answer": "D", "question": "根据《民法典》，下列关于民事责任的说法，错误的是（ ）。", "id": 78, "explanation": ["（一）用人者责任第一千一百九十一条用人单位的工作人员因执行工作任务造成他人损害的，由用人单位承担侵权责任", "用人单位承担侵权责任后，可以向有故意或者重大过失的工作人员追偿", "劳务派遣期间，被派遣的工作人员因执行工作任务造成他人损害的，由接受劳务派遣的用工单位承担侵权责任；", "第一千一百九十二条个人之间形成劳务关系，提供劳务一方因劳务造成他人损害的，由接受劳务一方承担侵权责任"]}, {"type": "单选", "chapter": "安全生产相关法律", "section": "第一节 民法典", "point": "考点五：与安全生产有关的规定", "options": [{"key": "A", "text": "连带责任"}, {"key": "B", "text": "补充责任"}, {"key": "C", "text": "按份责任"}, {"key": "D", "text": "有限责任"}], "answer": "B", "question": "根据《民法典》，因第三人的行为造成他人损害的，由第三人承担侵权责任；经营场所、公共场所的经营者、管理者或者群众性活动的组织者未尽到安全保障义务的，承担相应的（ ）。", "id": 79, "explanation": ["（一）用人者责任第一千一百九十一条用人单位的工作人员因执行工作任务造成他人损害的，由用人单位承担侵权责任", "用人单位承担侵权责任后，可以向有故意或者重大过失的工作人员追偿", "劳务派遣期间，被派遣的工作人员因执行工作任务造成他人损害的，由接受劳务派遣的用工单位承担侵权责任；", "第一千一百九十二条个人之间形成劳务关系，提供劳务一方因劳务造成他人损害的，由接受劳务一方承担侵权责任"]}, {"type": "单选", "chapter": "安全生产相关法律", "section": "第二节 中华人民共和国刑法", "point": "考点一：刑法的基本理论", "options": [{"key": "A", "text": "已满十五周岁的人犯罪，应当负刑事责任"}, {"key": "B", "text": "不满十八周岁的人，可以不予刑事处罚"}, {"key": "C", "text": "因不满十八周岁不予刑事处罚的，责令他的家长或者监护人加以管教;在必要的时候，依法进行专门矫治教育"}, {"key": "D", "text": "已满十四周岁不满十六周岁的人，犯故意杀人、故意伤害致人重伤或者死亡、强奸、抢劫、贩卖毒品、放火、爆炸、投毒罪的，应当负刑事责任"}], "answer": "D", "question": "依据《刑法》，下列关于刑事责任年龄的说法，正确的有（ ）。", "id": 80, "explanation": ["第十七条【刑事责任年龄】已满十六周岁的人犯罪，应当负刑事责任", "已满十四周岁不满十六周岁的人，犯故意杀人、故意伤害致人重伤或者死亡、强奸、抢劫、贩卖毒品、放火、爆炸、投放危险物质罪的，应当负刑事责任", "已满十二周岁不满十四周岁的人，犯故意杀人、故意伤害罪，致人死亡或者以特别残忍手段致人重伤造成严重残疾，情节恶劣，经最高人民检察院核准追诉的，应当负刑事责任", "对依照前三款规定追究刑事责任的不满十八周岁的人，应当从轻或者减轻处罚"]}, {"type": "单选", "chapter": "安全生产相关法律", "section": "第二节 中华人民共和国刑法", "point": "考点二：生产经营单位及其有关人员犯罪及其刑事责任", "options": [{"key": "A", "text": "重大责任事故罪"}, {"key": "B", "text": "危险作业罪"}, {"key": "C", "te int": "考点三：监测与预警", "options": [{"key": "A", "text": "启动应急预案"}, {"key": "B", "text": "加强对重点单位、重要部位和重要基础设施的安全保卫，维护社会治安秩序"}, {"key": "C", "text": "及时向社会发布有关采取特定措施避免或者减轻危害的建议、劝告"}, {"key": "D", "text": "调用军队进行抗洪抢险，转移易受突发事件危害的人员并予以妥善安置"}, {"key": "E", "text": "调集应急救援所需物资、设备、工具，准备应急设施和避难场所"}], "answer": "ABCE", "question": "某市连续多日大雨，气象局多次发布暴雨红色预警，该次极端强降雨导致当地内涝严重。有关部门及时发布洪灾警报，根据《突发事件应对法》的有关规定，在宣布进入预警期后，人民政府应当采取的措施包括（ ）。", "id": 118, "explanation": ["1.突发事件信息的收集与报告", "县级以上地方各级人民政府应当建立或者确定本地区统一的突发事件信息系统，汇集、储存、分析、传输有关突发事件的信息，并与上级人民政府及其有关部门、下级人民政府及其有关部门、专业机构和监测网点的突发事件信息系统实现互联互通，加强跨部门、跨地区的信息交流与情报合作", "第三十八条县级以上人民政府及其有关部门、专业机构应当通过多种途径收集突发事件信息", "县级人民政府应当在居民委员会、村民委员会和有关单位建立专职或者兼职信息报告员制度"]}, {"type": "多选", "chapter": "安全生产相关法律", "section": "第七节 中华人民共和国突发事件应对法", "point": "考点四：应急处置与救援", "options": [{"key": "A", "text": "组织营救和救治受害人员，疏散、撤离并妥善安置受到威胁的人员以及采取其他救助措施"}, {"key": "B", "text": "迅速控制危险源，标明危险区域，封锁危险场所，划定警戒区"}, {"key": "C", "text": "禁止或者限制使用有关设备、设施，关闭或者限制使用有关场所，中止人员密集的活动或者可能导致危害扩大的生产经营活动以及采取其他保护措施"}, {"key": "D", "text": "立即组织事故调查组，根据事故发生原因控制事故相关责任人"}, {"key": "E", "text": "依法从严惩处囤积居奇、哄抬物价、制假售假等扰乱市场秩序的行为，稳定市场价格，维护市场秩序"}], "answer": "ABCE", "question": "依据《突发事件应对法》，自然灾害、事故灾难或者公共卫生事件发生后人民政府采取的应急处置措施包括（ ）。", "id": 119, "explanation": ["第四十八条突发事件发生后，履行统一领导职责或者组织处置突发事件的人民政府应当针对其性质、特点和危害程度，立即组织有关部门，调动应急救援队伍和社会力量，依照本章的规定和有关法律、法规、规章的规定采取应急处置措施", "第四十九条自然灾害、事故灾难或者公共卫生事件发生后，履行统一领导职责的人民政府可以采取下列一项或者多项应急处置措施：", "（4）禁止或者限制使用有关设备、设施，关闭或者限制使用有关场所，中止人员密集的活动或者可能导致危害扩大的生产经营活动以及采取其他保护措施；", "（6）组织公民参加应急救援和处置工作，要求具有特定专长的人员提供服务；"]}, {"type": "单选", "chapter": "安全生产相关法律", "section": "第七节 中华人民共和国突发事件应对法", "point": "考点四：应急处置与救援", "options": [{"key": "A", "text": "突发事件发生后，不得为稳定市场而采取经济性处置措施"}, {"key": "B", "text": "突发事件发生后，履行统一领导职责或者组织处置突发事件的人民政府，应当按照有关规定统一、准确、及时发布有关突发事件事态发展和应急处置工作的信息"}, {"key": "C", "text": "突发事件发生后，履行统一领导职责或者组织处置突发事件的人民政府，必要时可以向单位和个人征用应急救援所需设备、设施、场地、交通工具和其他物资"}, {"key": "D", "text": "受到自然灾害危害或者发生事故灾难、公共卫生事件的单位，应当立即组织本单位应急救援队伍和工作人员营救受害人员，疏散、撤离、安置受到威胁的人员"}], "answer": "A", "question": "依据《突发事件应对法》，下列关于突发事件应急处置和救援的说法，错误的是（ ）。", "id": 120, "explanation": ["第四十八条突发事件发生后，履行统一领导职责或者组织处置突发事件的人民政府应当针对其性质、特点和危害程度，立即组织有关部门，调动应急救援队伍和社会力量，依照本章的规定和有关法律、法规、规章的规定采取应急处置措施", "第四十九条自然灾害、事故灾难或者公共卫生事件发生后，履行统一领导职责的人民政府可以采取下列一项或者多项应急处置措施：", "（4）禁止或者限制使用有关设备、设施，关闭或者限制使用有关场所，中止人员密集的活动或者可能导致危害扩大的生产经营活动以及采取其他保护措施；", "（6）组织公民参加应急救援和处置工作，要求具有特定专长的人员提供服务；"]}, {"type": "单选", "chapter": "安全生产相关法律", "section": "第八节 中华人民共和国职业病防治法", "point": "考点三：前期预防要求", "options": [{"key": "A", "text": "有与职业病危害防护相适应的设施"}, {"key": "B", "text": "有害与无害作业布局在同一区域"}, {"key": "C", "text": "职业病危害因素的强度或者浓度符合国家职业卫生标准"}, {"key": "D", "text": "设备、工具、用具等设施符合保护劳动者生理、心理健康的要求"}], "answer": "B", "question": "根据《中华人民共和国职业病防治法》中工作场所的职业卫生要求，用人单位下列做法错误的是（ ）。", "id": 121, "explanation": ["第十五条产生职业病危害的用人单位的设立除应当符合法律、行政法规规定的设立条件外，其工作场所还应当符合下列职业卫生要求：", "用人单位工作场所存在职业病目录所列职业病的危害因素的，应当及时、如实向所在地卫生行政部门申报危害项目，接受监督", "职业病危害因素分类目录由国务院卫生行政部门制定、调整并公布", "职业病危害项目申报的具体办法由国务院卫生行政部门制定"]}, {"type": "单选", "chapter": "安全生产相关法律", "section": "第八节 中华人民共和国职业病防治法", "point": "考点三：前期预防要求", "options": [{"key": "A", "text": "建设项目可能产生职业病危害的，建设单位在可行性论证阶段应当进行职业病危害预评价"}, {"key": "B", "text": "建设项目可能产生职业病危害的，建设单位应当向卫生行政部门提交放射性职业病危害预评价报告"}, {"key": "C", "text": "医疗机构建设项目可能产生放射性职业病危害的，建设单位未提交预评价报告或者预评价报告未经卫生行政部门审核同意的，不得开工建设"}, {"key": "D", "text": "职业病危害预评价报告应当确定危害类别和职业病防护措施"}], "answer": "B", "question": "根据《中华人民共和国职业病防治法》，关于建设项目职业病危害预评价的规定,说法错误的是（ ）。", "id": 122, "explanation": ["第十五条产生职业病危害的用人单位的设立除应当符合法律、行政法规规定的设立条件外，其工作场所还应当符合下列职业卫生要求：", "用人单位工作场所存在职业病目录所列职业病的危害因素的，应当及时、如实向所在地卫生行政部门申报危害项目，接受监督", "职业病危害因素分类目录由国务院卫生行政部门制定、调整并公布", "职业病危害项目申报的具体办法由国务院卫生行政部门制定"]}, {"type": "单选", "chapter": "安全生产相关法律", "section": "第八节 中华人民共和国职业病防治法", "point": "考点四：劳动过程中职业病的防护与管理", "options": [{"key": "A", "text": "用人单位应当向劳动者履行如实告知的义务"}, {"key": "B", "text": "用人单位应当协商变更原劳动合同相关条款"}, {"key": "C", "text": "用人单位应当将工作过程中可能产生的职业病危害及其后果如实告知劳动者"}, {"key": "D", "text": "劳动者拒绝从事存在职业病危害的作业，用人单位解除与劳动者所订立的劳动合同"}], "answer": "D", "question": "根据《中华人民共和国职业病防治法》，劳动者在已订立劳动合同期间因工作岗位或者工作内容变更，从事 品行业主管部门应当自受理申请之日起30日内进行审查，并对申请单位的销售场所和专用仓库等经营设施进行查验，对符合条件的，核发《民用爆炸物品销售许可证》；", "对不符合条件的，不予核发《民用爆炸物品销售许可证》，书面向申请人说明理由"]}, {"type": "单选", "chapter": "安全生产行政法规", "section": "第七节 民用爆炸物品安全管理条例", "point": "考点四：民用爆炸物品运输的安全管理规定", "options": [{"key": "A", "text": "运输单位安全管理人员的安全资格证"}, {"key": "B", "text": "运输时间、起始地点、运输路线、经停地点"}, {"key": "C", "text": "运输民用爆炸物品的特性、出现险情的应急处置办法"}, {"key": "D", "text": "运输民用爆炸物品的品种、数量、包装材料和包装方式"}], "answer": "A", "question": "运输民用爆炸物品，收货单位应当向运达地县级人民政府公安机关提出申请，并提交相应的材料。其中应当提交的材料不包括下列哪一项（ ）", "id": 168, "explanation": ["第二十六条运输民用爆炸物品，收货单位应当向运达地县级人民政府公安机关提出申请，并提交包括下列内容的材料：", "（1）民用爆炸物品生产企业、销售企业、使用单位以及进出口单位分别提供的《民用爆炸物品生产许可证》、《民用爆炸物品销售许可证》、《民用爆炸物品购买许可证》或者进出口批准证明；", "（3）运输民用爆炸物品的特性、出现险情的应急处置方法；", "受理申请的公安机关应当自受理申请之日起3日内对提交的有关材料进行审查，对符合条件的，核发《民用爆炸物品运输许可证》；"]}, {"type": "单选", "chapter": "安全生产行政法规", "section": "第七节 民用爆炸物品安全管理条例", "point": "考点五：爆破作业的安全管理规定", "options": [{"key": "A", "text": "爆破作业人员应当经省级人民政府公安机关考核合格，取得《爆破作业人员许可证》后，方可从事爆破作业"}, {"key": "B", "text": "爆破作业时，由爆破作业所在地县级人民政府应急管理部门负责组织实施安全警戒"}, {"key": "C", "text": "爆破作业单位应当将领取、发放民用爆炸物品的原始记录保存 2 年备查"}, {"key": "D", "text": "爆破作业单位不再使用民用爆炸物品时，应当将剩余的民用爆炸物品收回仓库"}], "answer": "C", "question": "根据《民用爆炸物品安全管理条例》，关于爆破作业的安全管理的说法，正确的是（ ）。", "id": 169, "explanation": ["1.爆破作业的安全许可", "第三十二条申请从事爆破作业的单位，应当按照国务院公安部门的规定，向有关人民政府公安机关提出申请，并提供能够证明其符合本条例", "受理申请的公安机关应当自受理申请之日起20日内进行审查，对符合条件的，核发《爆破作业单位许可证》；", "对不符合条件的，不予核发《爆破作业单位许可证》，书面向申请人说明理由"]}, {"type": "多选", "chapter": "安全生产行政法规", "section": "第七节 民用爆炸物品安全管理条例", "point": "考点六：民用爆炸物品储存的安全管理规定", "options": [{"key": "A", "text": "储存民用爆炸物品应当建立出入库检查、登记制度"}, {"key": "B", "text": "储存的民用爆炸物品数量不得超过储存设计容量"}, {"key": "C", "text": "对性质相抵触的民用爆炸物品在同一仓库存放的，应采取安全防护措施"}, {"key": "D", "text": "民用爆炸物品丢失、被盗、被抢，应当立即报告当地公安机关"}, {"key": "E", "text": "严禁在仓库区内吸烟和用火"}], "answer": "ABDE", "question": "根据《民用爆炸物品安全管理条例》，民用爆炸物品的储存应符合相关规定，下列说法正确的是（ ）。", "id": 170, "explanation": ["第四十条民用爆炸物品应当储存在专用仓库内，并按照国家规定设置技术防范设施", "第四十一条储存民用爆炸物品应当遵守下列规定：", "（1）建立出入库检查、登记制度，收存和发放民用爆炸物品必须进行登记，做到账目清楚，账物相符；", "（2）储存的民用爆炸物品数量不得超过储存设计容量，对性质相抵触的民用爆炸物品必须分库储存，严禁在库房内存放其他物品；"]}, {"type": "单选", "chapter": "安全生产行政法规", "section": "第八节 特种设备安全监察条例", "point": "考点一：特种设备安全监察的基本规定", "options": [{"key": "A", "text": "锅炉"}, {"key": "B", "text": "起重机械"}, {"key": "C", "text": "铁路机车"}, {"key": "D", "text": "大型游乐设施"}], "answer": "C", "question": "依据《特种设备安全监察条例》，下列所列选项中，不属于特种设备的是（ ）。", "id": 171, "explanation": ["前款特种设备的目录由国务院负责特种设备安全监督管理的部门（以下简称国务院特种设备安全监督管理部门）制订，报国务院批准后执行", "第三条特种设备的生产（含设计、制造、安装、改造、维修，下同）、使用、检验检测及其监督检查，应当遵守本条例，但本条例另有规定的除外", "房屋建筑工地和市政工程工地用起重机械、场（厂）内专用机动车辆的安装、使用的监督管理，由建设行政主管部门依照有关法律、法规的规定执行"]}, {"type": "单选", "chapter": "安全生产行政法规", "section": "第八节 特种设备安全监察条例", "point": "考点二：特种设备生产的安全规定", "options": [{"key": "A", "text": "锅炉"}, {"key": "B", "text": "氧舱"}, {"key": "C", "text": "客运索道"}, {"key": "D", "text": "电梯"}], "answer": "A", "question": "根据《特种设备安全监察条例》，下列特种设备的制造过程必须经国务院特种设备安全监督管理部门核准的检验检测机构按照安全技术规范的要求进行监督检验的是（ ）。", "id": 172, "explanation": ["第十一条压力容器的设计单位应当经国务院特种设备安全监督管理部门许可，方可从事压力容器的设计活动", "压力容器的设计单位应当具备下列条件：", "第十二条锅炉、压力容器中的气瓶（以下简称气瓶）、氧舱和客运索道、大型游乐设施以及高耗能特种设备的设计文件，应当经国务院特种设备安全监督管理部门核准的检验检测机构鉴定，方可用于制造", "第十四条锅炉、压力容器、电梯、起重机械、客运索道、大型游乐设施及其安全附件、安全保护装置的制造、安装、改造单位，以及压力管道用管子、管件、阀门、法兰、补偿器、安全保护装置等（以下简称压力管道元件）的制造单位和场（厂）内专用机动车辆的制造、改造单位，应当经国务院特种设备安全监督管理部门许可，方可从事相应的活动"]}, {"type": "单选", "chapter": "安全生产行政法规", "section": "第八节 特种设备安全监察条例", "point": "考点三：特种设备使用的安全规定", "options": [{"key": "A", "text": "特种设备使用单位对在用特种设备应当至少每周进行一次自行检查，并作出记录"}, {"key": "B", "text": "特种设备使用单位应当按照安全技术规范的定期检验要求，在安全检验合格有效期届满前 1 个月向特种设备检验检测机构提出定期检验要求"}, {"key": "C", "text": "电梯应当至少每月进行一次清洁、润滑、调整和检查"}, {"key": "D", "text": "大型游乐设施的运营使用单位的主要负责人至少应当每季度召开一次会议，督促、检查大型游乐设施的安全使用工作"}], "answer": "B", "question": "根据《特种设备安全监察条例》，关于特种设备使用安全的说法，正确的是（ ）。", "id": 173, "explanation": ["第二十五条特种设备在投入使用前或者投入使用后30日内，特种设备使用单位应当向直辖市或者设区的市的特种设备安全监督管理部门登记", "登记标志应当置于或者附着于该特种设备的显著位置", "第二十六条特种设备使用单位应当建立特种设备安全技术档案", "安全技术档案应当包括以下内容："]}, {"type": "单选", "chapter": "安全生产行政法规", "section": "第八节 特种设备安全监察条例", "point": "考点四：特种设备检验检测的规定", "options": [{"key": "A", "text": "从事型式试验的特种设备检验检测人员应当经国务院特种设备安全监督管理部门组织考核合格"}, {"key": "B", "text": "特种设备检验检测机构和检验检测人员对检验检测结果、鉴定结论负责"}, {"key": "C", "text": "特种设备检验检测机构和检验检测人员可从事特种设备的生产、销售"}, {"key": "D", "text": "特种设备检验检测人员不得同时在两个以上检验检测机构中执业"}], "answer": "C", "question": "根据《特种设备安全监察条例》，关于特种设备检验检测人员的要求，说法错误的是（ ）。", "id": 174, "explanation": ["第四十一条从事本条例规定的监督检验、定期检验、型式试验以及专门为特种设备生产、使用、检验检测提供无损检测服务的特种设备检验检测机构，应当经国务院特种设备安全监督管理部门核准", "特种设备使用单位设立的特种设备检验检测机构，经国务院特种设备安全监督管理部门核准，负责本单位核准范围内的特种设备定期检验工作", "第四十四条从事本条例规定的监督检验、定期检验、型式试验和无损检测的特种设备检验检测人员应当经国务院特种设备安全监督管理部门组织考核合格，取得检验检测人员证书，方可从事检验检测工作", "检验检测人员从事检验检测工作，必须在特种设备检验检测机构执业，但不得同时在两个以上检验检测机构中执业"]}, {"type": "单选", "chapter": "安全生产行政法规", "section": "第八节 特种设备安全监察条例", "point": "考点五：特种设备安全检查监督的规定", "options": [{"key": "A", "text": "地方各级人民政府负责特种设备安全监督管理的部门不得要求已经依照规定在其他地方取得许可的特种设备生产单位重复取得许可"}, {"key": "B", "text": "负责特种设备安全监督管理的部门在办理规定的许可时，其受理、审查、许可的程序必须公开，并应当自受理申请之日起三十日内，作出许可或者不予许可的决定"}, {"key": "C", "text": "对学校、幼儿园特种设备安全监督管理部门应当实施重点安全监察"}, {"key": "D", "text": "违反规定，被依法吊销许可证的，自吊销许可证之日起一年内，负责特种设备安全监督管理的部门不予受理其新的许可申请"}], "answer": "D", "question": "依据《特种设备安全监察条例》，下列关于特种设备监督管理的说法，错误的是（ ）。", "id": 175, "explanation": ["对学校、幼儿园以及车站、客运码头、商场、体育场馆、展览馆、公园等公众聚集场所的特种设备，特种设备安全监督管理部门应当实施重点安全监察", "2.许可、核准和登记的规定", "第五十二条依照本条例规定实施许可、核准、登记的特种设备安全监督管理部门，应当严格依照本条例规定条件和安全技术规范要求对有关事项进行审查；", "不符合本条例规定条件和安全技术规范要求的，不得许可、核准、登记；"]}, {"type": "单选", "chapter": "安全生产行政法规", "section": "第八节 特种设备安全监察条例", "point": "考点六：特种设备事故的报告和调查处理规定", "options": [{"key": "A", "text": "600 兆瓦以上锅炉爆炸"}, {"key": "B", "text": "600 兆瓦以上锅炉因安全故障中断运行 240 小时以上的"}, {"key": "C", "text": "起重机械整体倾覆的"}, {"key": "D", "text": "电梯轿厢滞留人员 2 小时以上的"}], "answer": "A", "question": "根据《特种设备安全监察条例》，下列属于特种设备特别重大事故的是（ ）。", "id": 176, "explanation": ["第六十一条有下列情形之一的，为特别重大事故：", "（1）特种设备事故造成30人以上死亡，或者100人以上重伤（包括急性工业中毒，下同），或者1亿元以上直接经济损失的；", "（2）600兆瓦以上锅炉爆炸的；", "（3）压力容器、压力管道有毒介质泄漏，造成15万人以上转移的；"]}, {"type": "单选", "chapter": "安全生产行政法规", "section": "第八节 特种设备安全监察条例", "point": "考点六：特种设备事故的报告和调查处理规定", "options": [{"key": "A", "text": "国务院或者国务院授权有关部门组织事故调查组"}, {"key": "B", "text": "国务院特种设备安全监督管理部门会同有关部门组织事故调查组"}, {"key": "C", "text": "省、自治区、直辖市特种设备安全监督管理部门会同有关部门组织事故调查组"}, {"key": "D", "text": "设区的市的特种设备安全监督管理部门会同有关部门组织事故调查组"}], "answer": "B", "question": "某化工厂发生特种设备事故，造成 15 人死亡，30 人重伤，根据《特种设备安全监察条例》的规定，该事故应当由（ ）进行调查。", "id": 177, "explanation": ["第六十一条有下列情形之一的，为特别重大事故：", "（1）特种设备事故造成30人以上死亡，或者100人以上重伤（包括急性工业中毒，下同），或者1亿元以上直接经济损失的；", "（2）600兆瓦以上锅炉爆炸的；", "（3）压力容器、压力管道有毒介质泄漏，造成15万人以上转移的；"]}, {"type": "单选", "chapter": "安全生产行政法规", "section": "第九节 生产安全事故应急条例", "point": "考点二：《条例》明确了生产安全事故应急工作的体制", "options": [{"key": "A", "text": "国务院应急管理部门统一领导全国的生产安全事故应急工作，县级以上地方人民政府应急管理部门统一领导本行政区域内的生产安全事故应急工作"}, {"key": "B", "text": "生产安全事故应急工作涉及两个以上行政区域的，应当由有关行政区域共同的上一级人民政府负责"}, {"key": "C", "text": "乡、镇人民政府以及街道办事处等地方人民政府派出机关应当协助上级人民政府有关部门依法履行生产安全事故应急工作职责"}, {"key": "D", "text": "县级以上人民政府负有安全生产监督管理职责的部门应当将其制定的生产安全事故应急救援预案报送本级人民政府应急管理部门备案"}], "answer": "C", "question": "根据《生产安全事故应急条例》，下列关于生产安全事故应急工作的说法，正确的是（ ）。", "id": 178, "explanation": ["第三条国务院统一领导全国的生产安全事故应急工作，县级以上地方人民政府统一领导本行政区域内的生产安全事故应急工作", "生产安全事故应急工作涉及两个以上行政区域的，由有关行政区域共同的上一级人民政府负责，或者由各有关行政区域的上一级人民政府共同负责", "县级以上人民政府应急管理部门和其他对有关行业、领域的安全生产工作实施监督管理的部门（以下统称负有安全生产监督管理职责的部门）在各自职责范围内，做好有关行业、领域的生产安全事故应急工作", "县级以上人民政府应急管理部门指导、协调本级人民政府其他负有安全生产监督管理职责的部门和下级人民政府的生产安全事故应急工作"]}, {"type": "多选", "chapter": "安全生产行政法规", "section": "第九节 生产安全事故应急条例", "point": "考点三：《条例》强化了生产安全事故的应急准备", "options": [{"key": "A", "text": "应急指挥机构及其职责发生调整的"}, {"key": "B", "text": "重要应急资源发生重大变化的"}, {"key": "C", "text": "单位经营状况不良"}, {"key": "D", "text": "安全生产面临的风险发生重大变化"}, {"key": "E", "text": "在应急演练和事故应急救援中发现需要修订预案的重大问题的"}], "answer": "ABDE", "question": "根据《生产安全事故应急条例》，应急预案应当及时修订的情况有（ ）。", "id": 179, "explanation": ["第五条县级以上人民政府及其负有安全生产监督管理职责的部门和乡、镇人民政府以及街道办事处等地方人民政府派出机关，应当针对可能发生的生产安全事故的特点和危害，进行风险辨识和评估，制定相应的生产安全事故应急救援预案，并依法向社会公布", "生产经营单位应当针对本单位可能发生的生产安全事故的特点和危害，进行风险辨识和评估，制定相应的生产安全事故应急救援预案，并向本单位从业人员公布", "第六条生产安全事故应急救援预案应当符合有关法律、法规、规章和标准的规定，具有科学性、针对性和可操作性，明确规定应急组织体系、职责分工以及应急救援程序和措施", "有下列情形之一的，生产安全事故应急救援预案制定单位应当及时修订相关预案："]}, {"type": "单选", "chapter": "安全生产行政法规", "section": "第九节 生产安全事故应急条例", "point": "考点三：《条例》强化了生产安全事故的应急准备", "options": [{"key": "A", "text": "县级以上人民政府负有安全生产监督管理职责的部门应当将其制定的生产安全事故应急救援预案报送本级人民政府备案"}, {"key": "B", "text": "县级以上地方人民政府以及县级以上人民政府负有安全生产监督管理职责的部门，应当至少每年组织1 次生产安全事故应急救援预案演练"}, {"key": "C", "text": "建筑施工单位应当至少每年组织 1 次生产安全事故应急救援预案演练"}, {"key": "D", "text": "小型的金属冶炼单位，可以不建立应急救援队伍，但应当指定专职的应急救援人员"}], "answer": "A", "question": "依据《生产安全事故应急条例》，下列关于生产安全事故应急准备的说法，正确的是（ ）。", "id": 180, "explanation": ["第五条县级以上人民政府及其负有安全生产监督管理职责的部门和乡、镇人民政府以及街道办事处等地方人民政府派出机关，应当针对可能发生的生产安全事故的特点和危害，进行风险辨识和评估，制定相应的生产安全事故应急救援预案，并依法向社会公布", "生产经营单位应当针对本单位可能发生的生产安全事故的特点和危害，进行风险辨识和评估，制定相应的生产安全事故应急救援预案，并向本单位从业人员公布", "第六条生产安全事故应急救援预案应当符合有关法律、法规、规章和标准的规定，具有科学性、针对性和可操作性，明确规定应急组织体系、职责分工以及应急救援程序和措施", "有下列情形之一的，生产安全事故应急救援预案制定单位应当及时修订相关预案："]}, {"type": "多选", "chapter": "安全生产行政法规", "section": "第九节 生产安全事故应急条例", "point": "考点三：《条例》强化了生产安全事故的应急准备", "options": [{"key": "A", "text": "可以不建立应急救援队伍"}, {"key": "B", "text": "指定兼职的应急救援人员"}, {"key": "C", "text": "可以与邻近的应急救援队伍签订应急救援协议"}, {"key": "D", "text": "应当建立应急救援队伍"}, {"key": "E", "text": "应当与邻近的应急救援队伍签订应急救援协议"}], "answer": "ABC", "question": "根据《生产安全事故应急条例》，小型企业或者微型企业等规模较小的建筑施工单位，建立应急救援队伍应符合下列要求（ ）。", "id": 181, "explanation": ["第五条县级以上人民政府及其负有安全生产监督管理职责的部门和乡、镇人民政府以及街道办事处等地方人民政府派出机关，应当针对可能发生的生产安全事故的特点和危害，进行风险辨识和评估，制定相应的生产安全事故应急救援预案，并依法向社会公布", "生产经营单位应当针对本单位可能发生的生产安全事故的特点和危害，进行风险辨识和评估，制定相应的生产安全事故应急救援预案，并向本单位从业人员公布", "第六条生产安全事故应急救援预案应当符合有关法律、法规、规章和标准的规定，具有科学性、针对性和可操作性，明确规定应急组织体系、职责分工以及应急救援程序和措施", "有下列情形之一的，生产安全事故应急救援预案制定单位应当及时修订相关预案："]}, {"type": "多选", "chapter": "安全生产行政法规", "section": "第九节 生产安全事故应急条例", "point": "考点三：《条例》强化了生产安全事故的应急准备", "options": [{"key": "A", "text": "易燃易爆物品、危险化学品等危险物品的生产、经营、储存、运输单位"}, {"key": "B", "text": "矿山、金属冶炼、建筑施工单位"}, {"key": "C", "text": "城市轨道交通运营单位"}, {"key": "D", "text": "宾馆、商场、娱乐场所、旅游景区等人员密集场所经营单位"}, {"key": "E", "text": "县级以上人民政府及其负有安全生产监督管理职责的部门"}], "answer": "ABCE", "question": "根据《生产安全事故应急条例》，下列单位中，建立应急值班制度，配备应急值班人员的是（ ）。", "id": 182, "explanation": ["第五条县级以上人民政府及其负有安全生产监督管理职责的部门和乡、镇人民政府以及街道办事处等地方人民政府派出机关，应当针对可能发生的生产安全事故的特点和危害，进行风险辨识和评估，制定相应的生产安全事故应急救援预案，并依法向社会公布", "生产经营单位应当针对本单位可能发生的生产安全事故的特点和危害，进行风险辨识和评估，制定相应的生产安全事故应急救援预案，并向本单位从业人员公布", "第六条生产安全事故应急救援预案应当符合有关法律、法规、规章和标准的规定，具有科学性、针对性和可操作性，明确规定应急组织体系、职责分工以及应急救援程序和措施", "有下列情形之一的，生产安全事故应急救援预案制定单位应当及时修订相关预案："]}, {"type": "单选", "chapter": "安全生产行政法规", "section": "第九节 生产安全事故应急条例", "point": "考点四：《条例》规范了生产安全事故的应急救援", "options": [{"key": "A", "text": "迅速控制危险源，组织抢救遇险人员"}, {"key": "B", "text": "维护事故现场秩序，保护事故现场和相关证据"}, {"key": "C", "text": "依法发布调用和征用应急资源的决定"}, {"key": "D", "text": "采取必要措施，防止事故危害扩大和次生、衍生灾害发生"}], "answer": "C", "question": "发生事故后，生产经营单位是第一救援力量，必须进行初期处置，避免事态扩大。根据《生产安全事故应急条例》，下列不属于生产经营单位采取的应急救援措施的是（ ）。", "id": 183, "explanation": ["1.生产经营单位的初期处置行为", "第十七条发生生产安全事故后，生产经营单位应当立即启动生产安全事故应急救援预案，采取下列一项或者多项应急救援措施，并按照国家有关规定报告事故情况：", "（2）根据事故危害程度，组织现场人员撤离或者采取可能的应急措施后撤离；", "（3）及时通知可能受到事故影响的单位和人员；"]}, {"type": "多选", "chapter": "安全生产行政法规", "section": "第十节 生产安全事故报告和调查处理条例", "point": "考点一：事故报告和调查处理的基本规定", "options": [{"key": "A", "text": "某事故造成 3 人死亡，500 万元直接经济损失，属于一般事故"}, {"key": "B", "text": "某事故造成 10 人急性工业中毒，1000 万元直接经济损失，属于重大事故"}, {"key": "C", "text": "某事故造成 15 人重伤，6000 万元间接经济损失，属于重大事故"}, {"key": "D", "text": "某事故造成 2 人死亡，20 人重伤，属于较大事故"}, {"key": "E", "text": "某事故造成 10 人下落不明，3 人死亡，属于较大事故"}], "answer": "DE", "question": "事故等级分为一般事故、较大事故、重大事故和特别重大事故。根据《生产安全事故报告和调查处理条例》，下列说法正确的有（ ）。", "id": 184, "explanation": ["第二条生产经营活动中发生的造成人身伤亡或者直接经济损失的生产安全事故的报告和调查处理，适用本条例；", "环境污染事故、核设施事故、国防科研生产事故的报告和调查处理不适用本条例", "第三条根据生产安全事故（以下简称事故）造成的人员伤亡或者直接经济损失，事故一般分为以下等级：", "（1）特别重大事故，是指造成30人以上死亡，或者100人以上重伤（包括急性工业中毒，下同），或者1亿元以上直接经济损失的事故；"]}, {"type": "多选", "chapter": "安全生产行政法规", "section": "第十节 生产安全事故报告和调查处理条例", "point": "考点二：生产安全事故报告的规定", "options": [{"key": "A", "text": "该起事故为一般事故"}, {"key": "B", "text": "单位负责人在接到事故报告后应当在 2 小时内向当地人民政府应急管理部门报告"}, {"key": "C", "text": "当地应急管理部门在接到报告后应当逐级上报至省级人民政府应急管理部门"}, {"key": "D", "text": "报告事故应当包括事故发生的详细经过、已经造成的伤亡人数、初步估计的直接经济损失"}, {"key": "E", "text": "事故发生之日起 30 日内出现新情况的，应当及时补报"}], "answer": "AE", "question": "某地冶炼厂风压机房，四名工人中午饭后准备施工，两名工人手触到振动器联接电缆线时，被电当场击倒，此时另外两名施工人员立即将电源开关断开，该场事故导致一名工人死亡，一人重伤。根据《生产安全事故报告和调查处理条例》的规定，下列说法正确的有（ ）。", "id": 185, "explanation": ["第九条事故发生后，事故现场有关人员应当立即向本单位负责人报告；", "单位负责人接到报告后，应当于1小时内向事故发生地县级以上人民政府安全生产监督管理部门和负有安全生产监督管理职责的有关部门报告", "情况紧急时，事故现场有关人员可以直接向事故发生地县级以上人民政府安全生产监督管理部门和负有安全生产监督管理职责的有关部门报告", "第十条安全生产监督管理部门和负有安全生产监督管理职责的有关部门接到事故报告后，应当依照下列规定上报事故情况，并通知公安机关、劳动保障行政部门、工会和人民检察院："]}, {"type": "多选", "chapter": "安全生产行政法规", "section": "第十节 生产安全事故报告和调查处理条例", "point": "考点三：生产安全事故调查的规定", "options": [{"key": "A", "text": "特别重大事故由国务院或者国务院授权有关部门组织事故调查组进行调查"}, {"key": "B", "text": "未造成人员伤亡的一般事故，县级人民政府应当委托事故发生单位组织事故调查组进行调查"}, {"key": "C", "text": "事故调查组组长由负责事故调查的人民政府应急管理部门指定"}, {"key": "D", "text": "事故调查组应当自事故发生之日起 30 日内提交事故调查报告"}], "answer": "A", "question": "根据《生产安全事故报告和调查处理条例》，关于生产安全事故调查的说法，正确的是（ ）。", "id": 186, "explanation": ["1.事故调查的一般规定", "第十九条特别重大事故由国务院或者国务院授权有关部门组织事故调查组进行调查", "重大事故、较大事故、一般事故分别由事故发生地省级人民政府、设区的市级人民政府、县级人民政府负责调查", "省级人民政府、设区的市级人民政府、县级人民政府可以直接组织事故调查组进行调查，也可以授权或者委托有关部门组织事故调查组进行调查"]}, {"type": "单选", "chapter": "安全生产行政法规", "section": "第十一节 工伤保险条例", "point": "考点二：缴纳工伤保险费的规定", "options": [{"key": "A", "text": "社保行政管理部门根据用人单位工伤保险费使用、工伤发生率等情况，适用所属行业内相应的费率档次确定单位缴费费率"}, {"key": "B", "text": "工伤保险费由职工个人和单位共同缴纳"}, {"key": "C", "text": "工伤保险费的数额为用人单位利润总额乘以单位缴费费率"}, {"key": "D", "text": "工伤保险费率根据以支定收、收支平衡原则确定"}], "answer": "D", "question": "根据《工伤保险条例》，关于工伤保险费缴纳的说法，正确的是（ ）。", "id": 187, "explanation": ["行业差别费率及行业内费率档次由国务院社会保险行政部门制定，报国务院批准后公布施行", "第十条用人单位应当按时缴纳工伤保险费", "对难以按照工资总额缴纳工伤保险费的行业，其缴纳工伤保险费的具体方式，由国务院社会保险行政部门规定"]}, {"type": "单选", "chapter": "安全生产行政法规", "section": "第十一节 工伤保险条例", "point": "考点三：工伤保险基金的使用", "options": [{"key": "A", "text": "工伤保险基金由用人单位缴纳的工伤保险费、工伤保险基金的利息和依法纳入工伤保险基金的其他资金构成"}, {"key": "B", "text": "工伤预防费用的提取比例、使用和管理的具体办法，由各省社会保险行政部门会同财政、卫生行政、应急管理等部门规定"}, {"key": "C", "text": "任何单位或者个人不得将工伤保险基金用于投资运营、兴建或者改建办公场所、发放奖金，或者挪作其他用途"}, {"key": " estion": "依据《工伤保险条例》的规定，某企业职工受工伤，经鉴定为三级伤残，生活部分不能自理，下列说法正确的是（ ）。", "id": 191, "explanation": ["第三十条职工因工作遭受事故伤害或者患职业病进行治疗，享受工伤医疗待遇", "职工治疗工伤应当在签订服务协议的医疗机构就医，情况紧急时可以先到就近的医疗机构急救", "工伤保险诊疗项目目录、工伤保险药品目录、工伤保险住院服务标准，由国务院社会保险行政部门会同国务院卫生行政部门、食品药品监督管理部门等部门规定", "职工住院治疗工伤的伙食补助费，以及经医疗机构出具证明，报经办机构同意，工伤职工到统筹地区以外就医所需的交通、食宿费用从工伤保险基金支付，基金支付的具体标准由统筹地区人民政府规定"]}, {"type": "多选", "chapter": "安全生产行政法规", "section": "第十一节 工伤保险条例", "point": "考点五：工伤保险待遇的规定", "options": [{"key": "A", "text": "在停工留薪期内，原工资福利待遇不变，由所在工伤保险基金按月支付"}, {"key": "B", "text": "停工留薪期最长不超过 24 个月"}, {"key": "C", "text": "如果小王被鉴定为四级伤残，单位和工伤保险基金给予一定赔偿，可以解除劳动关系"}, {"key": "D", "text": "小王经伤残鉴定后，生活大部分不能自理，护理费为小王平均工资的 40%"}, {"key": "E", "text": "如果小王被鉴定为四级伤残，则可以领取一次性伤残补助金的数量为 21 个月的本人工资"}], "answer": "BE", "question": "小王在工作中受伤，依据《工伤保险条例》，关于工伤保险待遇的规定正确的有（ ）。", "id": 192, "explanation": ["第三十条职工因工作遭受事故伤害或者患职业病进行治疗，享受工伤医疗待遇", "职工治疗工伤应当在签订服务协议的医疗机构就医，情况紧急时可以先到就近的医疗机构急救", "工伤保险诊疗项目目录、工伤保险药品目录、工伤保险住院服务标准，由国务院社会保险行政部门会同国务院卫生行政部门、食品药品监督管理部门等部门规定", "职工住院治疗工伤的伙食补助费，以及经医疗机构出具证明，报经办机构同意，工伤职工到统筹地区以外就医所需的交通、食宿费用从工伤保险基金支付，基金支付的具体标准由统筹地区人民政府规定"]}, {"type": "单选", "chapter": "安全生产行政法规", "section": "第十一节 工伤保险条例", "point": "考点五：工伤保险待遇的规定", "options": [{"key": "A", "text": "丧葬补助金为 6 个月的该职工月平均工资"}, {"key": "B", "text": "供养亲属抚恤金按照职工本人工资的一定比例发给由因工死亡职工生前提供主要生活来源、无劳动能力的亲属"}, {"key": "C", "text": "核定的各供养亲属的抚恤金之和不应高于因工死亡职工生前的工资"}, {"key": "D", "text": "一次性工亡补助金标准为上一年度全国城镇居民人均可支配收入的 20 倍"}], "answer": "A", "question": "根据《工伤保险条例》，职工因工死亡，其近亲属按照规定从工伤保险基金领取丧葬补助金、供养亲属抚恤金和一次性工亡补助金，下列说法错误的是（ ）。", "id": 193, "explanation": ["第三十条职工因工作遭受事故伤害或者患职业病进行治疗，享受工伤医疗待遇", "职工治疗工伤应当在签订服务协议的医疗机构就医，情况紧急时可以先到就近的医疗机构急救", "工伤保险诊疗项目目录、工伤保险药品目录、工伤保险住院服务标准，由国务院社会保险行政部门会同国务院卫生行政部门、食品药品监督管理部门等部门规定", "职工住院治疗工伤的伙食补助费，以及经医疗机构出具证明，报经办机构同意，工伤职工到统筹地区以外就医所需的交通、食宿费用从工伤保险基金支付，基金支付的具体标准由统筹地区人民政府规定"]}, {"type": "多选", "chapter": "安全生产行政法规", "section": "第十二节 大型群众性活动安全管理条例", "point": "考点一：大型群众性活动的范围", "options": [{"key": "A", "text": "参加人数达到 1200 人的体育比赛活动"}, {"key": "B", "text": "参加人数达到 800 人的演唱会"}, {"key": "C", "text": "参加人数达到 2000 人的展览、展销"}, {"key": "D", "text": "参加人数达到 500 人的焰火晚会"}, {"key": "E", "text": "公园在其日常业务范围内举办的参加人数达到 1000 人以上的活动"}], "answer": "AC", "question": "根据《大型群众性活动安全管理条例》，下列属于大型群众性活动的是（ ）。", "id": 194, "explanation": ["第二条本条例所称大型群众性活动，是指法人或者其他组织面向社会公众举办的每场次预计参加人数达到1000人以上的下列活动：", "影剧院、音乐厅、公园、娱乐场所等在其日常业务范围内举办的活动，不适用本条例的规定", "第三条大型群众性活动的安全管理应当遵循安全第一、预防为主的方针，坚持承办者负责、政府监管的原则"]}, {"type": "单选", "chapter": "安全生产行政法规", "section": "第十二节 大型群众性活动安全管理条例", "point": "考点二：安全责任", "options": [{"key": "A", "text": "为大型群众性活动的安全工作提供必要的保障"}, {"key": "B", "text": "审核承办者提交的大型群众性活动申请材料，实施安全许可"}, {"key": "C", "text": "保障临时搭建的设施、建筑物的安全，消除安全隐患"}, {"key": "D", "text": "保障疏散通道、安全出口、消防车通道、应急广播、应急照明、疏散指示标志符合法律、法规、技术标准的规定"}], "answer": "B", "question": "大型群众性活动应当加强安全管理，落实安全责任，根据《大型群众性活动安全管理条例》，属于公安机关应当履行职责的是（ ）。", "id": 195, "explanation": ["第五条大型群众性活动的承办者（以下简称承办者）对其承办活动的安全负责，承办者的主要负责人为大型群众性活动的安全责任人", "第六条举办大型群众性活动，承办者应当制订大型群众性活动安全工作方案", "第七条承办者具体负责下列安全事项：", "（三）按照负责许可的公安机关的要求，配备必要的安全检查设备，对参加大型群众性活动的人员进行安全检查，对拒不接受安全检查的，承办者有权拒绝其进入；"]}, {"type": "单选", "chapter": "安全生产行政法规", "section": "第十二节 大型群众性活动安全管理条例", "point": "考点三：安全管理", "options": [{"key": "A", "text": "大型群众性活动的预计参加人数在 1000 人以下的，由活动所在地县级人民政府公安机关实施安全许可"}, {"key": "B", "text": "大型群众性活动的预计参加人数在 1000 人以上 5000 人以下的，由活动所在地县级人民政府公安机关实施安全许可"}, {"key": "C", "text": "大型群众性活动预计参加人数在 5000 人以上的，由国务院公安部门实施安全许可"}, {"key": "D", "text": "跨省、自治区、直辖市举办大型群众性活动的，由活动所在地设区的市级人民政府公安机关或者直辖市人民政府公安机关实施安全许可"}], "answer": "B", "question": "依据《大型群众性活动安全管理条例》规定，关于大型群众性活动安全许可的说法，正确的是（ ）。", "id": 196, "explanation": ["1.大型群众性活动的安全许可", "第十一条公安机关对大型群众性活动实行安全许可制度", "第十二条大型群众性活动的预计参加人数在1000人以上5000人以下的，由活动所在地县级人民政府公安机关实施安全许可；", "预计参加人数在5000人以上的，由活动所在地设区的市级人民政府公安机关或者直辖市人民政府公安机关实施安全许可；"]}, {"type": "单选", "chapter": "安全生产行政法规", "section": "第十三节 女职工劳动保护特别规定", "point": "考点二：女职工禁忌从事的劳动范围", "options": [{"key": "A", "text": "该公司安排陈某经期从事体力劳动为二级的劳动"}, {"key": "B", "text": "陈某怀孕两个月该公司安排其进行夜班劳动"}, {"key": "C", "text": "安排陈某怀孕期间从事冷水作业"}, {"key": "D", "text": "安排陈某怀孕期间从事第二级高温作业"}], "answer": "C", "question": "陈某是某工贸企业一名女职工。下列关于该工贸企业对陈某的工作安排，违反《女职工劳动保护特别规定》的是（ ）。", "id": 197, "explanation": ["（三）每小时负重6次以上、每次负重超过20公斤的作业，或者间断负重、每次负重超过25公斤的作业", "（四）高处作业分级标准中规定的第三级、第四级高处作业", "（三）非密封源放射性物质的操作，核事故与放射事故的应急处置；", "（四）高处作业分级标准中规定的高处作业；"]}, {"type": "单选", "chapter": "安全生产行政法规", "section": "第十三节 女职工劳动保护特别规定", "point": "考点七：哺乳规定", "options": [{"key": "A", "text": "女职工生育享受 98 天产假，其中产前可以休假 15 天，难产的，增加产假 15 天"}, {"key": "B", "text": "女职工怀孕 2 个月流产的，享受 42 天产假"}, {"key": "C", "text": "对已经参加生育保险的女职工，其产假期间的生育津贴按照用人单位上年度职工月平均工资的标准由生育保险基金支付，对未参加生育保险的，按照女职工产假前工资的标准由用人单位支付"}, {"key": "D", "text": "用人单位应当在每天的劳动时间内为哺乳期女职工安排 1 小时哺乳时间，女职工生育多胞胎的，每多哺乳 1 个婴儿每天增加 1 小时哺乳时间"}], "answer": "B", "question": "依据《女职工劳动保护特别规定》，下列关于用人单位对女职工的特殊保护，说法错误的是（ ）。", "id": 198, "explanation": ["第九条对哺乳未满1周岁婴儿的女职工，用人单位不得延长劳动时间或者安排夜班劳动", "用人单位应当在每天的劳动时间内为哺乳期女职工安排1小时哺乳时间；", "女职工生育多胞胎的，每多哺乳1个婴儿每天增加1小时哺乳时间", "第十条女职工比较多的用人单位应当根据女职工的需要，建立女职工卫生室、孕妇休息室、哺乳室等设施，妥善解决女职工在生理卫生、哺乳方面的困难"]}, {"type": "单选", "chapter": "安全生产行政法规", "section": "第十四节 煤矿安全生产条例", "point": "考点二：煤矿企业的安全生产责任", "options": [{"key": "A", "text": "安全设施设计应当报国家矿山安全监察局进行审查"}, {"key": "B", "text": "安全设施设计需要作重大变更的，可以先根据变更后的设计文件进行施工之后进行安全设施设计的审查"}, {"key": "C", "text": "乙施工单位应当按照批准的安全设施设计施工，不得擅自变更设计内容"}, {"key": "D", "text": "乙施工单位应当对参与煤矿建设项目的设计监理等单位进行统一协调管理，对煤矿建设项目安全管理负总责"}], "answer": "C", "question": "甲国有矿山企业新建一大型煤矿工程项目，由乙施工单位负责施工建设，委托具备设计资质的丙单位进行安全设施设计，根据《煤矿安全生产条例》的规定，关于该煤矿建设项目的管理，下列选项说法正确的是（）。", "id": 199, "explanation": ["第十四条新建、改建、扩建煤矿工程项目（以下统称煤矿建设项目）的建设单位应当委托具有建设工程设计企业资质的设计单位进行安全设施设计", "安全设施设计应当包括煤矿水、火、瓦斯、冲击地压、煤尘、顶板等主要灾害的防治措施，符合国家标准或者行业标准的要求，并报省、自治区、直辖市人民政府负有煤矿安全生产监督管理职责的部门审查", "安全设施设计需要作重大变更的，应当报原审查部门重新审查，不得先施工后报批、边施工边修改", "第十五条煤矿建设项目的建设单位应当对参与煤矿建设项目的设计、施工、监理等单位进行统一协调管理，对煤矿建设项目安全管理负总责"]}, {"type": "单选", "chapter": "安全生产行政法规", "section": "第十四节 煤矿安全生产条例", "point": "考点二：煤矿企业的安全生产责任", "options": [{"key": "A", "text": "王某应当组织制定并实施安全生产教育和培训计划"}, {"key": "B", "text": "张某应当保证安全生产投入的有效实施"}, {"key": "C", "text": "张某应当组织制定并实施生产安全事故应急救援预案 "key": "B", "text": "县级以上地方人民政府应急管理部门负责监督检查本行政区域特种作业人员的安全技术培训和持证上岗工作"}, {"key": "C", "text": "国家矿山安全监察局指导、监督全国煤矿特种作业人员的安全技术培训、考核、发证、复审工作"}, {"key": "D", "text": "考核发证机关不得委托其他机构部门或者人员实施特种作业人员的考核、发证、复审工作"}], "answer": "D", "question": "依据《特种作业人员安全技术培训考核管理规定》，下列关于特种作业人员的资格许可及监督管理的说法，错误的是（ ）。", "id": 212, "explanation": ["1.特种作业人员的资格许可", "第五条特种作业人员必须经专门的安全技术培训并考核合格，取得《中华人民共和国特种作业操作证》（以下简称特种作业操作证）后，方可上岗作业", "第六条特种作业人员的安全技术培训、考核、发证、复审工作实行统一监管、分级实施、教考分离的原则", "第七条国家安全生产监督管理总局（以下简称安全监管总局）指导、监督全国特种作业人员的安全技术培训、考核、发证、复审工作；"]}, {"type": "单选", "chapter": "安全生产部门规章", "section": "第三节 特种作业人员安全技术培训考核管理规定", "point": "考点四：特种作业人员的安全培训", "options": [{"key": "A", "text": "跨省、自治区、直辖市从业的特种作业人员，可以在户籍所在地参加培训"}, {"key": "B", "text": "省人民政府安全生产监督管理部门可以委托设区的市人民政府安全生产监督管理部门实施特种作业人员的考核、发证、复审工作"}, {"key": "C", "text": "对特种作业人员的安全技术培训，具备安全培训条件的生产经营单位应当以自主培训为主,也可以委托培训"}, {"key": "D", "text": "已经取得职业高中的毕业生从事与其所学专业相应的特种作业，可以免于考试直接发证"}], "answer": "D", "question": "根据《特种作业人员安全技术培训考核管理规定》，下列关于特种作业人员安全培训、特种作业操作证申请的说法，错误的是（ ）。", "id": 213, "explanation": ["第九条特种作业人员应当接受与其所从事的特种作业相应的安全技术理论培训和实际操作培训", "已经取得职业高中、技工学校及中专以上学历的毕业生从事与其所学专业相应的特种作业，持学历证明经考核发证机关同意，可以免予相关专业的培训", "跨省、自治区、直辖市从业的特种作业人员，可以在户籍所在地或者从业所在地参加培训", "第十条对特种作业人员的安全技术培训，具备安全培训条件的生产经营单位应当以自主培训为主，也可以委托具备安全培训条件的机构进行培训"]}, {"type": "多选", "chapter": "安全生产部门规章", "section": "第三节 特种作业人员安全技术培训考核管理规定", "point": "考点五：特种作业人员的考核发证", "options": [{"key": "A", "text": "考试由考核发证机关负责，审核由其委托的单位负责"}, {"key": "B", "text": "考核发证机关或其委托的单位收到申请后，应当在 45 日内组织考试"}, {"key": "C", "text": "特种作业操作资格考试包括安全技术理论考试和实际操作考试两部分。考试不及格的，应重新参加相应的安全技术培训"}, {"key": "D", "text": "考核发证机关或其委托承担特种作业操作资格考试的单位，应当在考试结束后 10 个工作日内公布考试成绩"}, {"key": "E", "text": "对已经受理的申请，考核发证机关应当在 20 个工作日内完成审核工作"}], "answer": "DE", "question": "根据《特种作业人员安全技术培训考核管理规定》，下列关于特种作业人员的考核发证的说法正确的有（ ）。", "id": 214, "explanation": ["考试由考核发证机关或其委托的单位负责；", "审核由考核发证机关负责", "考核发证机关或其委托的单位应当按照安全监管总局、煤矿安监局统一制定的考核标准进行考核", "第十三条参加特种作业操作资格考试的人员，应当填写考试申请表，由申请人或者申请人的用人单位持学历证明或者培训机构出具的培训证明向申请人户籍所在地或者从业所在地的考核发证机关或其委托的单位提出申请"]}, {"type": "多选"
